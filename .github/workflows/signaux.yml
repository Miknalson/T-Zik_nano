name: Signaux quotidiens

on:
  schedule:
    - cron: "37 21 * * *"   # 23h37 à Paris l'été, 22h37 l'hiver : après la clôture US
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: signaux
  cancel-in-progress: false

jobs:
  analyser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signaux/requirements.txt

      - run: pip install -r signaux/requirements.txt

      - name: Calculer les signaux
        run: |
          python signaux/signaux.py --public --sortie site/index.html
          cp signaux/icone.png site/

      - name: Enregistrer le journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signaux/journal_signaux.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Journal des signaux du $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: analyser
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
