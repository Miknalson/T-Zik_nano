name: Signaux quotidiens

on:
  push:
    branches:
      - claude/hello-claude-hi46j6
    paths:
      - 'anglais-a2/**'
      - 'signaux/*.py'
      - '.github/workflows/signaux.yml'
  schedule:
    # 7h17, 7h47 et 8h17 à Paris l'été (une heure plus tôt l'hiver). GitHub saute parfois un
    # passage programmé ; le journal garantit qu'une consigne n'est notifiée qu'une fois.
    - cron: "17 5 * * *"
    - cron: "47 5 * * *"
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Envoyer aussi une notification de test"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: signaux
  cancel-in-progress: false

jobs:
  analyser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signaux/requirements.txt

      - run: pip install -r signaux/requirements.txt

      - name: Vérifier les calculs et les garde-fous
        run: |
          cd signaux
          python test_validation.py
          python test_prudence.py
          python test_recherche.py
          python test_bot.py

      - name: Comparer les variantes sans modifier le bot
        continue-on-error: true
        run: |
          mkdir -p site
          python signaux/recherche_trading.py --snapshots site/recherche-data

      - name: Calculer les signaux
        env:
          NTFY_TOPIC: ${{ github.event_name != 'push' && secrets.NTFY_TOPIC || '' }}
        run: |
          python signaux/signaux.py --capital 1000 --sortie site/index.html ${{ inputs.test_notification && '--notif-test' || '' }}
          cp signaux/icone.png site/
          if [ -f signaux/recherche_trading.json ]; then cp signaux/recherche_trading.json site/; fi

      - name: Ajouter l'application d'anglais au site
        run: |
          cp -r anglais-a2 site/anglais
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" site/anglais/index.html
          mkdir -p site/anglais/mots
          (cd site/anglais/mots && ls | grep -iE '\.(mp4|webm|mov)$' | jq -R . | jq -s . > index.json || echo '[]' > index.json)

      - name: Enregistrer le journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signaux/journal_signaux.csv
          if [ -f signaux/recherche_trading.json ]; then git add signaux/recherche_trading.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Journal des signaux du $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: analyser
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
