name: Bot crypto Kraken

on:
  schedule:
    # Juste après la clôture journalière de Kraken (00 h 00 UTC). Un passage en double
    # le même jour ne refait rien : le bot n'achète que s'il n'a pas déjà la position.
    - cron: "7 0 * * *"
    - cron: "37 0 * * *"
  workflow_dispatch:
    inputs:
      verifier:
        description: "Vérifier la clé Kraken (aucun ordre exécuté)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signaux/requirements.txt

      - run: pip install -r signaux/requirements.txt

      - name: Tests du bot
        run: cd signaux && python test_bot.py

      # Mode réel seulement si la variable de dépôt BOT_MODE vaut « reel » ou « réel » (réglée à la main
      # dans GitHub). Sinon : papier, ou vérification si elle est demandée au lancement manuel.
      - name: Passe du jour
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          MODE: ${{ inputs.verifier && 'verifier' || ((vars.BOT_MODE == 'reel' || vars.BOT_MODE == 'réel') && 'reel' || 'papier') }}
          BUDGET: ${{ vars.BOT_BUDGET || '0' }}
          MAX: ${{ vars.BOT_MAX || '5' }}
        run: python signaux/bot.py --mode "$MODE" --budget "$BUDGET" --max-positions "$MAX"

      - name: Enregistrer le portefeuille
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signaux/bot_portefeuille.json signaux/bot_journal.csv
          git add signaux/bot_reel.json signaux/bot_reel_journal.csv 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bot du $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      # Remet la page à jour tout de suite (page du bot : gains, pertes, opérations).
      - name: Rafraîchir la page
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run signaux.yml --ref "$GITHUB_REF_NAME"
