name: Test accès plateformes crypto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - name: Actions tokenisées (xStocks) disponibles par l'API Kraken
        run: |
          curl -s -m 30 "https://api.kraken.com/0/public/AssetPairs" -o paires.json
          python3 - <<'PY'
          import json
          paires = json.load(open("paires.json"))["result"]
          xs = sorted({(v["altname"], v.get("status"), v.get("aclass_base")) for v in paires.values()
                       if v.get("aclass_base") not in (None, "currency") or "x" in v["altname"][:6] and v["altname"][:1].isupper() and any(c.islower() for c in v["altname"])})
          print(f"{len(paires)} paires au total")
          print(f"Paires d'actions ou d'autres classes : {len(xs)}")
          for alt, statut, classe in xs[:80]:
              print(alt, statut, classe)
          PY
