name: "🛑 Bot : arrêter ou reprendre"
run-name: "🛑 ${{ inputs.commande }}"

on:
  workflow_dispatch:
    inputs:
      commande:
        description: "Que doit faire le bot ?"
        type: choice
        default: "Arrêter (garder les positions)"
        options:
          - "Arrêter (garder les positions)"
          - "Arrêter et tout vendre"
          - "Reprendre"

permissions:
  contents: write
  actions: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  commande:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signaux/requirements.txt

      - run: pip install -r signaux/requirements.txt

      - name: Appliquer la commande
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          MODE: ${{ (vars.BOT_MODE == 'reel' || vars.BOT_MODE == 'réel') && 'reel' || 'papier' }}
          BUDGET: ${{ vars.BOT_BUDGET || '0' }}
          MAX: ${{ vars.BOT_MAX || '5' }}
          COMMANDE: ${{ inputs.commande == 'Reprendre' && 'reprendre' || (inputs.commande == 'Arrêter et tout vendre' && 'tout-vendre' || 'arreter') }}
        run: python signaux/bot.py --commande "$COMMANDE" --mode "$MODE" --budget "$BUDGET" --max-positions "$MAX"

      - name: Enregistrer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signaux/bot_arret.json signaux/bot_portefeuille.json signaux/bot_journal.csv
          git add signaux/bot_reel.json signaux/bot_reel_journal.csv 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bot : ${{ inputs.commande }}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      # Remet la page à jour tout de suite pour que la carte du bot affiche son nouvel état.
      - name: Rafraîchir la page
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run signaux.yml --ref "$GITHUB_REF_NAME"
