const KEY='speakup-a2-v1';
let S;

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
function addXP(n,unit,kind){
  S.xp+=n;
  const t=today();
  if(S.last!==t){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak=(S.last===y)?S.streak+1:1; S.last=t;
  }
  if(unit){S.done[unit]=S.done[unit]||{};S.done[unit][kind]=true}
  save();head();
}
function head(){
  document.getElementById('streak').textContent='🔥 '+S.streak+' jour'+(S.streak>1?'s':'');

/* ============================ VOIX ============================ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'))}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,rate=.85){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)){res();return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=rate;
    const v=voices.find(v=>v.lang==='en-US')||voices[0];if(v)u.voice=v;
    u.onend=res;u.onerror=res;speechSynthesis.speak(u);
  });
}
function listen(){
  return new Promise((res,rej)=>{
    if(!SR){rej('unsupported');return}
    const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;
    r.onresult=e=>{const a=Array.from(e.results[0]).map(x=>x.transcript);a.conf=e.results[0][0].confidence||null;res(a)};
    r.onerror=e=>rej(e.error);
    r.onnomatch=()=>rej('nomatch');
    r.start();
  });
}
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
// Score = part des mots attendus dits dans le bon ordre (plus longue sous-séquence commune).
function compare(target,heard){
  const t=norm(target),h=norm(heard);
  const dp=Array.from({length:t.length+1},()=>Array(h.length+1).fill(0));
  for(let i=1;i<=t.length;i++)for(let j=1;j<=h.length;j++)
    dp[i][j]=t[i-1]===h[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const hit=new Set();let i=t.length,j=h.length;
  while(i>0&&j>0){ if(t[i-1]===h[j-1]){hit.add(i-1);i--;j--} else if(dp[i-1][j]>=dp[i][j-1])i--; else j--; }
  return {score:t.length?Math.round(100*hit.size/t.length):0,
          html:t.map((w,k)=>`<span class="${hit.has(k)?'w-ok':'w-bad'}">${w}</span>`).join(' ')};
}
async function bestMatch(target){
  const alts=await listen();
  let best=null;
  for(const a of alts){const c=compare(target,a);c.heard=a;if(!best||c.score>best.score)best=c}
  return best;
}

const ttsRate=()=>S.speed==='auto'?Math.max(.55,Math.min(1,.55+(S.lvl-20)/65*.45)):+S.speed;
let spk=0;
async function say(text,slow){
  const t=++spk,r=slow?.5:ttsRate(),gap=slow?900:S.lvl<50?700:S.lvl<68?350:100;
  for(const sen of text.split(/(?<=[.!?])\s+/)){
    if(t!==spk)return;
    await speak(sen,r);
    if(t!==spk)return;
    await new Promise(z=>setTimeout(z,gap));
  }
}

async function api(system,messages,max=800){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.model,max_tokens:max,system,messages})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error&&j.error.message||('Erreur '+r.status));
  return j.content.map(c=>c.text||'').join('');
}
function style(){
  const l=S.lvl;
  if(l<30)return 'VERY simple. 1-2 sentences, max 8 words each, present simple only, the 500 most common words, no phrasal verbs, no idioms, no contractions. Yes/no or very short-answer questions.';
  if(l<50)return 'Simple. 2 sentences, max 12 words each, present/past/future simple, everyday words, no idioms. Easy open questions.';
  if(l<68)return 'Intermediate. 2-3 sentences, max 16 words each, may use present perfect, modals, contractions and common phrasal verbs. Open questions.';
  return 'Natural, like a normal conversation with a friendly colleague: 3-4 sentences, normal vocabulary, contractions, occasional idioms (briefly explained in corrections only if the learner struggles). Open, thought-provoking questions.';
}
function sysPrompt(){
  const errs=Object.entries(S.errs).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>e[0]).join('; ')||'none yet';
  return `You are a warm, patient English tutor for a French-speaking adult who wants to speak English at work. Learner level score: ${Math.round(S.lvl)}/100 (10=A1, 35=A2, 55=A2+, 70=B1, 90=B2). Scenario: ${SCEN[scen][1]}.
Style for this level: ${style()} Always end with ONE question so the learner keeps talking. Stay just slightly above the learner's level and never switch to French in 'reply'.
The learner's messages come from speech recognition, so ignore capitalization and punctuation. A speech recognition confidence (0-1) may be appended: a low value suggests unclear pronunciation.
Return ONLY a JSON object, no other text:
{"reply": English text,
 "corrections": [{"said": learner's wrong phrase, "better": corrected phrase, "fr": French translation of the corrected phrase, "why": short explanation in French}] (max 2, the most important mistakes only, [] if none),
 "pronunciation": one short tip in French about a sound hard for French speakers that matters here (th, h, -ed endings, final s, short/long vowels...), or "" if not relevant,
 "praise": a short encouraging remark in French,
 "new_words": [{"en": useful word or phrase from your reply, "fr": translation}] (max 2),
 "score": integer 0-100, CEFR level shown by the learner's last message}
Learner's recurring mistakes: ${errs}. If the message is "[start]", greet the learner and ask a first easy question for the scenario; corrections must be [] and score ${Math.round(S.lvl)}.`;
}
function parseAI(raw){
  try{const m=raw.match(/\{[\s\S]*\}/);const d=JSON.parse(m[0]);if(typeof d.reply==='string')return d}catch(e){}
  return {reply:raw,corrections:[],pronunciation:'',praise:'',new_words:[]};
}
function vChat(){
  if(!S.key){
    $v.innerHTML=`<div class="card"><h2>🤖 Tuteur IA</h2>
    <p>Le tuteur discute avec vous à la voix, vous corrige, travaille votre prononciation et fait évoluer votre niveau. Il utilise l’IA <b>Claude</b>, qui demande une <b>clé API</b> :</p>
    <ol><li>Créez un compte sur <b>console.anthropic.com</b></li><li>Ajoutez un petit crédit (Billing)</li><li>Menu <b>API Keys</b> → créez une clé et collez-la ci-dessous</li></ol>
    <input id="key" type="password" placeholder="sk-ant-…" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit">
    <div class="row"><button class="btn primary" onclick="saveKey()">Enregistrer</button></div>
    <p class="mute">La clé reste dans votre navigateur et n’est envoyée qu’à Anthropic. N’utilisez pas cette app sur un ordinateur partagé.</p></div>`;return}
  $v.innerHTML=`<div class="card">
   <div class="row" style="margin:0 0 10px">
    <select id="scen" onchange="scen=this.value;chat=[];logHTML='';fb=[];vChat()">${Object.entries(SCEN).map(([k,v])=>`<option value="${k}" ${k===scen?'selected':''}>${v[0]}</option>`).join('')}</select>
    <select onchange="S.speed=this.value;save()" title="Vitesse de la voix">${[['auto','Vitesse auto (selon mon niveau)'],['.55','Très lent'],['.7','Lent'],['.85','Moyen'],['1','Normal']].map(([v,l])=>`<option value="${v}" ${S.speed===v?'selected':''}>${l}</option>`).join('')}</select>
    <label class="mute"><input type="checkbox" ${hands?'checked':''} onchange="hands=this.checked"> Mains libres</label>
    <button class="btn" onclick="chat=[];logHTML='';fb=[];vChat()">↺ Nouvelle</button>
    <button class="btn" onclick="S.key='';save();vChat()">🔑</button></div>
   <div id="log">${logHTML||'<div class="mute">Appuyez sur « Commencer » : le tuteur parle en premier. Répondez avec le micro 🎤 (ou tapez). Il vous corrigera à chaque réponse.</div>'}</div>
   <div class="score" id="status"></div>
   <div class="row">${chat.length?'':'<button class="btn primary" onclick="send(\'[start]\',null,true)">Commencer</button>'}
    <button class="btn primary mic" id="mic" onclick="talk()">🎤</button>
    <input id="txt" placeholder="…ou écrivez en anglais" style="flex:1;min-width:140px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit" onkeydown="if(event.key==='Enter')sendTxt()">
    <button class="btn" onclick="sendTxt()">Envoyer</button></div></div>`;
  const l=document.getElementById('log');l.scrollTop=l.scrollHeight;
}
function saveKey(){const k=document.getElementById('key').value.trim();if(!k)return;S.key=k;save();vChat()}
function sendTxt(){const t=document.getElementById('txt');const v=t.value.trim();if(v){t.value='';send(v,null)}}
function setStatus(h){const e=document.getElementById('status');if(e)e.innerHTML=h}
function addLog(h){logHTML+=h;const l=document.getElementById('log');if(l){l.innerHTML=logHTML;l.scrollTop=l.scrollHeight}}
async function talk(){
  if(busy)return;spk++;speechSynthesis.cancel();
  if(!SR){setStatus(errMsg('unsupported'));return}
  const m=document.getElementById('mic');if(m)m.classList.add('rec');setStatus('Je vous écoute…');
  try{const a=await listen();setStatus('');if(m)m.classList.remove('rec');await send(a[0],a.conf)}
  catch(e){setStatus(errMsg(e));if(m)m.classList.remove('rec')}
}
async function send(text,conf,hidden){
  if(busy)return;busy=true;
  if(!hidden)addLog(`<div class="bubble you">${esc(text)}${conf!=null?`<div class="mute" style="color:inherit;opacity:.8">Clarté de prononciation estimée : ${Math.round(conf*100)}%</div>`:''}</div>`);
  chat.push({role:'user',content:text+(conf!=null?`\n[speech recognition confidence: ${conf.toFixed(2)}]`:'')});
  setStatus('🤔 Le tuteur réfléchit…');
  let d,raw;
  try{const n=chat.length;raw=await api(sysPrompt(),chat.slice(n>15?n-15:0));d=parseAI(raw)}
  catch(e){chat.pop();busy=false;setStatus(`⚠️ ${esc(e.message)}${/auth|key|401/i.test(e.message)?' — vérifiez votre clé (bouton 🔑).':''}`);return}
  chat.push({role:'assistant',content:raw});setStatus('');
  const i0=fb.length;
  let h=`<div class="bubble bot">${esc(d.reply)}<div class="row" style="margin:6px 0 0"><button class="btn" onclick="say(${esc(JSON.stringify(d.reply)).replace(/'/g,'&#39;')})">🔊</button> <button class="btn" onclick="say(${esc(JSON.stringify(d.reply)).replace(/'/g,'&#39;')},true)">🐢 Très lent</button> <button class="btn" onclick="tr(this,${chat.length-1})">🇫🇷 Traduire</button></div></div>`;
  const cs=(d.corrections||[]).filter(c=>c&&c.better);
  if(!hidden&&(cs.length||d.pronunciation||d.praise)){
    h+='<div class="tip">';
    if(d.praise)h+=`👏 ${esc(d.praise)}<br>`;
    cs.forEach(c=>{
      fb.push(c.better);const i=fb.length-1;
      h+=`<div style="margin-top:8px">❌ <s>${esc(c.said||'')}</s><br>✅ <b>${esc(c.better)}</b> <span class="mute">${esc(c.fr||'')}</span><br><span>${esc(c.why||'')}</span>
      <div class="row" style="margin:6px 0 0"><button class="btn" onclick="speak(fb[${i}],.8)">🔊</button> <button class="btn" onclick="drill(${i})">🎤 Répéter</button> <span id="fb${i}"></span></div></div>`;
      const k=(c.why||'').toLowerCase().slice(0,70);if(k)S.errs[k]=(S.errs[k]||0)+1;
      S.cards[c.better]=S.cards[c.better]||{box:0,due:0};
      if(c.fr)S.extra[c.better]=c.fr;
    });
    if(d.pronunciation)h+=`<div style="margin-top:8px">🗣️ <b>Prononciation :</b> ${esc(d.pronunciation)}</div>`;
    h+='</div>';
  }
  (d.new_words||[]).slice(0,2).forEach(w=>{if(w&&w.en){S.cards[w.en]=S.cards[w.en]||{box:0,due:0};S.extra[w.en]=w.fr||''}});
  if((d.new_words||[]).length)h+=`<div class="mute">📝 Ajouté à la révision : ${d.new_words.map(w=>esc(w.en)+' = '+esc(w.fr||'')).join(' · ')}</div>`;
  addLog(h);
  if(!hidden&&typeof d.score==='number'){bump((d.score-S.lvl)*.1);addXP(4)}else save();
  head();busy=false;
  await say(d.reply);
  if(hands&&tab==='chat')talk();
}
async function tr(btn,idx){
  btn.disabled=true;btn.textContent='…';
  try{const t=JSON.parse((chat[idx].content.match(/\{[\s\S]*\}/)||['{}'])[0]).reply||chat[idx].content;
    const f=await api('Translate the following English text into French. Output only the translation.',[{role:'user',content:t}],300);
    btn.parentNode.insertAdjacentHTML('afterend',`<div class="mute" style="color:inherit;opacity:.8">${esc(f)}</div>`);btn.remove()}
  catch(e){btn.textContent='Erreur'}
}
async function drill(i){
  const el=document.getElementById('fb'+i);
  if(!SR){el.textContent=errMsg('unsupported');return}
  el.textContent='Je vous écoute…';
  try{const c=await bestMatch(fb[i]);el.innerHTML=`<b>${c.score}%</b> ${c.html}`;if(c.score>=70){addXP(2);bump(.2);rate(fb[i],true)}}
  catch(e){el.textContent=errMsg(e)}
}

/* --- Leçons --- */
function vLearn(){
  if(cur)return vUnit(cur);
  $v.innerHTML=`<div class="card"><b>Bienvenue !</b> Pour chaque thème : 1) <b>écoutez et répétez</b> les phrases, 2) jouez un <b>dialogue</b> à voix haute, 3) <b>parlez librement</b>. Faites 15 minutes par jour : la régularité compte plus que la durée.</div>
  <div class="units">${UNITS.map(u=>`<div class="card unit" onclick="openUnit('${u.id}')"><h3>${u.icon} ${u.title}</h3><span class="mute">${u.sub}</span><div class="bar"><i style="width:${pct(u)}%"></i></div></div>`).join('')}</div>`;
}
function openUnit(id){cur=UNITS.find(u=>u.id===id);render()}
function vUnit(u){
  $v.innerHTML=`<a class="back" onclick="go('learn')">← Toutes les leçons</a><h2>${u.icon} ${u.title}</h2>
  <div class="units">
   <div class="card unit" onclick="startPhrases()"><h3>1. Écoute & répète</h3><span class="mute">${u.phrases.length} phrases clés</span></div>
   <div class="card unit" onclick="startDialogue()"><h3>2. Dialogue</h3><span class="mute">Jeu de rôle avec le micro</span></div>
   <div class="card unit" onclick="startTalk()"><h3>3. Parle librement</h3><span class="mute">Questions + début de phrase</span></div>
  </div>`;
}

/* 1. Phrases */
let pi=0;
function startPhrases(){pi=0;shPhrase()}
function shPhrase(){
  const u=cur,[en,fr,tip]=u.phrases[pi];
  S.cards[en]=S.cards[en]||{box:0,due:0};
  $v.innerHTML=`<a class="back" onclick="openUnit('${u.id}')">← ${u.title}</a>
  <div class="card"><div class="mute">Phrase ${pi+1}/${u.phrases.length}</div>
   <div class="en">${en}</div><div class="fr">${fr}</div>${tip?`<div class="tip">💡 ${tip}</div>`:''}
   <div class="row"><button class="btn" onclick="speak(${JSON.stringify(en)},.8)">🔊 Écouter</button>
    <button class="btn" onclick="speak(${JSON.stringify(en)},.55)">🐢 Lent</button>
    <button class="btn primary mic" id="mic" onclick="tryPhrase()">🎤</button></div>
   <div class="score" id="res">Écoutez, puis appuyez sur 🎤 et dites la phrase.</div>
   <div class="row"><button class="btn" ${pi?'':'disabled'} onclick="pi--;shPhrase()">←</button>
    <button class="btn" onclick="nextPhrase()">${pi<u.phrases.length-1?'Suivant →':'Terminer ✔'}</button></div></div>`;
  speak(en,.8);
}
function nextPhrase(){
  if(pi<cur.phrases.length-1){pi++;shPhrase()}
  else{addXP(20,cur.id,'phrases');alert('Bravo ! +20 points');openUnit(cur.id)}
}
async function tryPhrase(){
  const en=cur.phrases[pi][0],m=document.getElementById('mic'),r=document.getElementById('res');
  if(!SR){ // sans reconnaissance vocale : auto-évaluation
    r.innerHTML='Dites la phrase à voix haute, puis évaluez-vous : <button class="btn ok" onclick="self(true)">Bien dit</button> <button class="btn bad" onclick="self(false)">À refaire</button>';return}
  m.classList.add('rec');r.textContent='Je vous écoute…';
  try{
    const c=await bestMatch(en);
    r.innerHTML=`<b>${c.score}%</b> — ${verdict(c.score)}<br>${c.html}<div class="mute">J’ai entendu : « ${c.heard} »</div>`;
    if(c.score>=70){addXP(2);bump(.15);rate(en,true)}else rate(en,false);
  }catch(e){r.textContent=errMsg(e)}
  m.classList.remove('rec');
}
function self(ok){rate(cur.phrases[pi][0],ok);if(ok)addXP(2);document.getElementById('res').textContent=ok?'👍 Bien !':'Réessayez, avec le modèle lent 🐢.'}
// Révision espacée simple (boîtes de Leitner : 1, 2, 4, 8, 16 jours)
function rate(en,ok){
  const c=S.cards[en]=S.cards[en]||{box:0,due:0};
  c.box=ok?Math.min(c.box+1,4):0;c.due=Date.now()+[0,1,2,4,8][c.box]*864e5;save();
}

/* 2. Dialogue */
let di=0,hideText=false;
function startDialogue(){di=0;shDialogue()}
function shDialogue(){
  const u=cur;
  $v.innerHTML=`<a class="back" onclick="openUnit('${u.id}')">← ${u.title}</a>
  <div class="card"><div class="row" style="margin:0 0 8px"><label class="mute"><input type="checkbox" ${hideText?'checked':''} onchange="hideText=this.checked;shDialogue()"> Masquer ma réplique (mode difficile)</label></div>
  <div id="chat"></div><div class="score" id="res"></div><div class="row" id="ctl"></div></div>`;
  for(let i=0;i<di;i++)bubble(u.dialogue[i]);
  step();
}
function bubble(t,hide){
  document.getElementById('chat').insertAdjacentHTML('beforeend',
   `<div class="bubble ${t.w}"><div>${hide?`<span class="hide">${t.en}</span>`:t.en}</div><div class="mute" style="color:inherit;opacity:.75">${t.fr}</div></div>`);
}
async function step(){
  const u=cur,t=u.dialogue[di],ctl=document.getElementById('ctl'),r=document.getElementById('res');
  if(!t){addXP(30,u.id,'dialogue');r.innerHTML='🎉 Dialogue terminé ! +30 points';ctl.innerHTML=`<button class="btn" onclick="startDialogue()">Rejouer</button> <button class="btn primary" onclick="openUnit('${u.id}')">Retour</button>`;return}
  if(t.w==='bot'){bubble(t);ctl.innerHTML='';await speak(t.en);di++;step();return}
  bubble(t,hideText);
  r.textContent='À vous ! Dites votre réplique.';
  ctl.innerHTML=`<button class="btn" onclick="speak(${JSON.stringify(t.en)},.8)">🔊 Modèle</button>
   <button class="btn primary mic" id="mic" onclick="tryTurn()">🎤</button>
   <button class="btn" onclick="di++;document.getElementById('chat').innerHTML='';for(let i=0;i<di;i++)bubble(cur.dialogue[i]);step()">Passer →</button>`;
}
async function tryTurn(){
  const t=cur.dialogue[di],m=document.getElementById('mic'),r=document.getElementById('res');
  if(!SR){r.innerHTML='Dites-la à voix haute, puis : <button class="btn ok" onclick="di++;shDialogue()">Bien dit, suite →</button>';return}
  m.classList.add('rec');r.textContent='Je vous écoute…';
  try{
    const c=await bestMatch(t.en);
    r.innerHTML=`<b>${c.score}%</b> ${verdict(c.score)}<br>${c.html}`;
    if(c.score>=65){addXP(3);m.classList.remove('rec');setTimeout(()=>{di++;shDialogue()},1500);return}
  }catch(e){r.textContent=errMsg(e)}
  m.classList.remove('rec');
}

/* 3. Parler librement */
let ti=0;
function startTalk(){ti=0;shTalk()}
function shTalk(){
  const u=cur,[q,starter]=u.talk[ti];
  $v.innerHTML=`<a class="back" onclick="openUnit('${u.id}')">← ${u.title}</a>
  <div class="card"><div class="mute">Question ${ti+1}/${u.talk.length}</div>
   <div class="en">${q}</div><div class="tip">🧩 Commencez par : <b>${starter}</b></div>
   <div class="row"><button class="btn" onclick="speak(${JSON.stringify(q)},.85)">🔊 Écouter la question</button>
    <button class="btn primary mic" id="mic" onclick="tryTalk()">🎤</button></div>
   <div class="score" id="res">Répondez en 1 à 3 phrases. Ne cherchez pas la perfection : parlez !</div>
   <div class="row"><button class="btn" onclick="nextTalk()">${ti<u.talk.length-1?'Question suivante →':'Terminer ✔'}</button></div></div>`;
  speak(q,.85);
}
async function tryTalk(){
  const m=document.getElementById('mic'),r=document.getElementById('res');
  if(!SR){r.textContent='Répondez à voix haute. (La transcription nécessite Chrome, Edge ou Safari.)';addXP(5);return}
  m.classList.add('rec');r.textContent='Je vous écoute…';
  try{
    const alts=await listen();const said=alts[0];
    const n=norm(said).length;
    r.innerHTML=`Vous avez dit : <b>« ${said} »</b><div class="mute">${n} mots. ${n<6?'Essayez d’ajouter « because … » (parce que) pour allonger.':'Très bien : phrase complète !'}</div>
    <div class="row"><button class="btn" onclick="speak(${JSON.stringify(said)},.9)">🔊 Réécouter ma phrase</button></div>`;
    addXP(5);
  }catch(e){r.textContent=errMsg(e)}
  m.classList.remove('rec');
}
function nextTalk(){
  if(ti<cur.talk.length-1){ti++;shTalk()}
  else{addXP(20,cur.id,'talk');alert('Bravo ! +20 points');openUnit(cur.id)}
}

/* --- Révision --- */
let deck=[],ci=0;
function vCards(){
  const all=UNITS.flatMap(u=>u.phrases.map(p=>({en:p[0],fr:p[1]}))).concat(Object.keys(S.extra).map(k=>({en:k,fr:S.extra[k]||'(à retenir)'})));
  const seen=all.filter(p=>S.cards[p.en]);
  deck=seen.filter(p=>S.cards[p.en].due<=Date.now()).sort(()=>Math.random()-.5);
  ci=0;
  if(!seen.length){$v.innerHTML='<div class="card">Commencez d’abord une leçon « Écoute & répète » : les phrases apparaîtront ici pour être révisées au bon moment.</div>';return}
  if(!deck.length){$v.innerHTML=`<div class="card">✅ Rien à réviser maintenant. ${seen.length} phrases sont dans votre mémoire. Revenez demain !</div>`;return}
  shCard();
}
function shCard(){
  if(ci>=deck.length){addXP(10);$v.innerHTML='<div class="card">🎉 Révision terminée ! +10 points</div>';return}
  const c=deck[ci];
  $v.innerHTML=`<div class="card"><div class="mute">Carte ${ci+1}/${deck.length} — Dites la phrase en anglais</div>
   <div class="en">${c.fr}</div><div class="row"><button class="btn" id="rv" onclick="this.parentNode.nextElementSibling.style.display='block'">Voir la réponse</button></div>
   <div style="display:none;margin-top:12px"><div class="en">${c.en}</div>
    <div class="row"><button class="btn" onclick="speak(${JSON.stringify(c.en)},.8)">🔊</button>
    <button class="btn bad" onclick="rate(${JSON.stringify(c.en)},false);ci++;shCard()">Je ne savais pas</button>
    <button class="btn ok" onclick="rate(${JSON.stringify(c.en)},true);ci++;shCard()">Je savais</button></div></div></div>`;
}

/* --- Parler librement (transcription libre) --- */
function vFree(){
  const qs=UNITS.flatMap(u=>u.talk.map(t=>t[0]));
  $v.innerHTML=`<div class="card"><h2>💬 Parlez 1 minute</h2>
  <p>Choisissez un sujet et parlez sans vous arrêter, même avec des erreurs. C’est l’exercice le plus efficace pour devenir fluide.</p>
  <select id="topic">${qs.map(q=>`<option>${q}</option>`).join('')}</select>
  <div class="row"><button class="btn" onclick="speak(topic.value)">🔊 Écouter</button>
   <button class="btn primary mic" id="mic" onclick="freeTalk()">🎤</button></div>
  <div class="score" id="res"></div></div>`;
}
async function freeTalk(){
  const m=document.getElementById('mic'),r=document.getElementById('res');
  if(!SR){r.textContent=errMsg('unsupported');return}
  m.classList.add('rec');r.textContent='Je vous écoute…';
  try{const a=await listen();r.innerHTML=`Vous avez dit : <b>« ${a[0]} »</b><div class="mute">${norm(a[0]).length} mots</div>`;addXP(5)}
  catch(e){r.textContent=errMsg(e)}
  m.classList.remove('rec');
}

/* --- Plan --- */
function vPlan(){
  const done=UNITS.reduce((n,u)=>n+pct(u),0)/UNITS.length|0;
  const errs=Object.entries(S.errs).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $v.innerHTML=`<div class="card"><h2>🎓 Votre niveau : ${lvlName()}</h2><div class="bar"><i style="width:${S.lvl}%"></i></div>
  <p class="mute">Estimation sur 100 (A2 ≈ 35, A2+ ≈ 55, B1 ≈ 70). Elle évolue à chaque conversation avec le tuteur et à chaque phrase bien dite.</p>
  ${errs.length?'<b>Vos erreurs les plus fréquentes</b><ul>'+errs.map(e=>`<li>${esc(e[0])} <span class="mute">(×${e[1]})</span></li>`).join('')+'</ul>':'<p class="mute">Les erreurs relevées par le tuteur apparaîtront ici.</p>'}</div>
  <div class="card"><h2>🗓️ Plan de 15 min par jour</h2>
  <ol><li><b>3 min</b> – Révision (onglet 🃏, inclut vos corrections)</li><li><b>4 min</b> – Une leçon : écoute & répète</li><li><b>8 min</b> – Conversation avec le tuteur IA 🤖</li></ol>
  <p>Progression globale : <b>${done}%</b>. Avec 15 min/jour, un thème se maîtrise en 3 jours : les 7 thèmes en ~3 semaines. Ensuite, passez le dialogue en <i>mode difficile</i> (réplique masquée).</p>
  <div class="tip">💡 Conseils : parlez toujours <b>à voix haute</b>, répétez la même phrase 3 fois, écoutez la version lente 🐢, et n’ayez pas peur des erreurs.</div></div>
  <div class="card"><b>Votre profil</b><p class="mute">Niveau visé : A2 → B1. Vos données restent sur votre appareil.</p>
  <button class="btn bad" onclick="if(confirm('Effacer toute la progression ?')){localStorage.removeItem(KEY);location.reload()}">Réinitialiser</button></div>`;
}

render();
</script>
</body>
</html>
