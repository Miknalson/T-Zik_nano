<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Speak Up A2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5ff;--card:#fff;--ink:#16193d;--mute:#6b7094;--brand:#5b4bff;--brand2:#2fb6e8;--accent:#ff6b4a;--ok:#12b886;--bad:#fa5252;--warn:#f59f00;--line:#e2e5f6;--soft:#ecebff;--shadow:0 6px 20px rgba(60,50,160,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f24;--card:#171a38;--ink:#eef0ff;--mute:#9ba0c9;--brand:#8b7dff;--brand2:#4cc9f0;--line:#2a2e57;--soft:#232650;--shadow:0 6px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font:600 16px/1.5 'Nunito',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;max-width:760px;margin:auto}
header .logo{font-weight:900;font-size:21px;flex:1;letter-spacing:-.3px}
header .logo b{color:var(--brand)}
.pill{background:var(--card);border-radius:99px;padding:5px 12px;font-weight:800;font-size:14px;box-shadow:var(--shadow)}
main{max-width:760px;margin:auto;padding:4px 16px 20px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:22px;font-weight:900;margin:8px 0 12px}
h3{margin:0;font-size:17px;font-weight:900}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:24px;padding:18px;display:flex;gap:16px;align-items:center;margin-bottom:14px;box-shadow:0 10px 28px rgba(91,75,255,.35)}
.hero .t{flex:1;min-width:0}.hero small{opacity:.85;font-weight:700}
.hero .big{font-size:23px;font-weight:900;line-height:1.2}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.btn{border:0;background:var(--soft);color:var(--brand);border-radius:14px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;color:var(--mute)}
.btn.big{width:100%;padding:14px;font-size:17px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.mute{color:var(--mute);font-size:14px;font-weight:600}
.step{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--bg);margin-bottom:8px}
.step .ic{width:42px;height:42px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.step.done .ic{background:var(--ok);color:#fff}
.step .tx{flex:1;min-width:0}.step .tx b{display:block}
.path{display:grid;gap:10px}
.node{display:flex;gap:14px;align-items:center;cursor:pointer;margin:0}
.node.lock{opacity:.55;cursor:default}
.node .ic{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--soft);flex:none;position:relative}
.node .ic svg{position:absolute;inset:-3px;transform:rotate(-90deg)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:9px;transition:width .5s}
.en{font-size:25px;font-weight:900;line-height:1.3}
.fr{color:var(--mute);margin-top:2px}
.tip{background:var(--soft);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:15px}
.score{font-size:16px;margin-top:12px}
.w-ok{color:var(--ok);font-weight:900}.w-bad{color:var(--bad);font-weight:900;text-decoration:underline}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:13px 14px;margin-top:8px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--ok);background:rgba(18,184,134,.14);animation:pop .35s}
.opt.wrong{border-color:var(--bad);background:rgba(250,82,82,.12);animation:shake .35s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.blank{display:inline-block;min-width:44px;border-bottom:3px solid var(--brand);text-align:center;color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border-radius:14px;border:2px dashed var(--line);margin-top:10px}
.chip{border:0;border-radius:12px;padding:8px 12px;background:var(--soft);color:var(--ink);font:inherit;font-weight:800;box-shadow:0 3px 0 var(--line);cursor:pointer}
.fbk{margin-top:12px;border-radius:16px;padding:12px 14px;animation:in .25s}
.fbk.ok{background:rgba(18,184,134,.15)}.fbk.no{background:rgba(250,82,82,.13)}
.mic{width:70px;height:70px;border-radius:50%;font-size:28px;padding:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;box-shadow:0 6px 18px rgba(91,75,255,.4);cursor:pointer;flex:none}
.mic.rec{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(250,82,82,.55)}100%{box-shadow:0 0 0 22px rgba(250,82,82,0)}}
.bubble{padding:11px 14px;border-radius:18px;margin:8px 0;max-width:88%;animation:in .25s}
.bubble.bot{background:var(--soft);border-bottom-left-radius:6px}
.bubble.you{background:var(--brand);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.bubble .sub{font-size:13px;opacity:.75;margin-top:4px}
#log{max-height:52vh;overflow:auto;padding-right:2px}
input[type=text],input[type=password],select{font:inherit;font-weight:700;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);box-shadow:0 -6px 24px rgba(40,30,120,.12);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}
nav button{flex:1;max-width:120px;border:0;background:none;color:var(--mute);font:inherit;font-size:11px;font-weight:800;padding:6px 2px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:23px;line-height:1.1;transition:transform .2s}
nav button.on{color:var(--brand);background:var(--soft)}nav button.on span{transform:translateY(-2px) scale(1.12)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;display:none}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.bars i{display:block;border-radius:8px 8px 4px 4px;background:linear-gradient(var(--brand2),var(--brand));min-height:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--shadow)}.stat b{display:block;font-size:24px;font-weight:900;color:var(--brand)}
.bubble .btn,.tip .btn{background:var(--card);box-shadow:0 2px 0 var(--line)}
a.back{cursor:pointer;color:var(--brand);font-weight:800;font-size:14px;display:inline-block;margin-bottom:4px}
</style>
</head>
<body>
<header>
  <div class="logo">Speak<b>Up</b> A2</div>
  <span class="pill" id="streak"></span>
  <span class="pill" id="xp"></span>
</header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<canvas id="fx"></canvas>

<script>
/* ============================ OUTILS ============================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const _t=[];const T=s=>(_t.push(s),_t.length-1);          // registre de textes pour les boutons 🔊
const today=()=>new Date().toISOString().slice(0,10);
function toast(m,ms=5000){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
window.addEventListener('error',e=>toast('Erreur : '+(e.message||'inconnue')+' — dites-le moi et je corrige.'));
window.addEventListener('unhandledrejection',e=>toast('Erreur : '+((e.reason&&e.reason.message)||e.reason||'inconnue')));
function confetti(){
  const c=$('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#5b4bff','#2fb6e8','#ff6b4a','#12b886','#f59f00'];
  const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:5+Math.random()*6,c:cols[Math.random()*5|0],r:Math.random()*6}));
  let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})();
}

/* ============================ CONTENU ============================ */
// min = niveau (sur 100) qui débloque l'unité ; sinon on la débloque en terminant la précédente.
const UNITS=[
{id:'intro',icon:'👋',title:'Se présenter',sub:'Introduce yourself',min:0,scn:'Meeting someone for the first time at work: name, country, languages',
 g:{t:'Le verbe « to be »',h:'<b>I am</b>, <b>you are</b>, <b>he / she is</b>, <b>we / they are</b>. En anglais le sujet est <b>toujours obligatoire</b> : on dit « I am from France », jamais « am from France ».',ex:['I am Marc.','She is my colleague.','We are from Lyon.']},
 phrases:[
  ['Hello, my name is Marc.','Bonjour, je m’appelle Marc.','Dites votre vrai prénom à la place de Marc.'],
  ['Nice to meet you.','Enchanté.','« meet » se prononce /miit/.'],
  ['I am from France.','Je viens de France.',''],
  ['I live in Lyon.','J’habite à Lyon.','« live » (verbe) se prononce /liv/, court.'],
  ['I speak French and a little English.','Je parle français et un peu anglais.','« a little » = un peu.'],
  ['I am learning English for my career.','J’apprends l’anglais pour ma carrière.',''],
  ['How are you today?','Comment allez-vous aujourd’hui ?',''],
  ['Could you repeat that, please?','Pouvez-vous répéter, s’il vous plaît ?','La phrase la plus utile de l’anglais : utilisez-la sans honte !']],
 fill:[['I ___ from France.',['am','is','are'],0,'Avec « I », on utilise « am ».'],['She ___ Marta.',['am','is','are'],1,'Avec « she », on utilise « is ».'],['Nice to ___ you.',['meet','met','meeting'],0,'« Nice to meet you ».']],
 dialogue:[
  {w:'bot',en:'Hello! Nice to meet you. What is your name?',fr:'Bonjour ! Enchanté. Comment vous appelez-vous ?'},
  {w:'you',en:'Hello, my name is Marc. Nice to meet you.',fr:'Bonjour, je m’appelle Marc. Enchanté.'},
  {w:'bot',en:'Where are you from?',fr:'D’où venez-vous ?'},
  {w:'you',en:'I am from France. I live in Lyon.',fr:'Je viens de France. J’habite à Lyon.'},
  {w:'bot',en:'Do you speak English?',fr:'Parlez-vous anglais ?'},
  {w:'you',en:'I speak a little English. I am learning every day.',fr:'Je parle un peu anglais. J’apprends tous les jours.'}],
 talk:[['What is your name and where are you from?','My name is … I am from …'],['Where do you live?','I live in … It is a … city.'],['Why are you learning English?','I am learning English because …']]},

{id:'job',icon:'💼',title:'Mon travail',sub:'Talk about your job',min:0,scn:'Talking about your job, your company, your team and your daily work',
 g:{t:'Le présent simple',h:'Même forme que l’infinitif, <b>sauf he / she / it qui prend un -s</b> : I work, she work<b>s</b>. Négation : <b>do not / does not</b> + verbe de base (he does not work).',ex:['I work in Lyon.','She works in Paris.','He does not work on Fridays.']},
 phrases:[
  ['I work as a sales assistant.','Je travaille comme assistant commercial.','Remplacez « sales assistant » par votre métier.'],

  ['I would like to learn new skills.','J’aimerais acquérir de nouvelles compétences.',''],
  ['My goal is to work with international clients.','Mon objectif est de travailler avec des clients internationaux.','']],
 fill:[['She ___ in a bank.',['work','works','working'],1,'3e personne (he/she) → -s.'],['I ___ in a team of five.',['work','works','am work'],0,'Avec « I », pas de -s.'],['He ___ not like meetings.',['do','does','is'],1,'Négation 3e personne → does not.']],
 dialogue:[
  {w:'bot',en:'What do you do?',fr:'Que faites-vous dans la vie ?'},
  {w:'you',en:'I work as a sales assistant. I work for a small company.',fr:'Je travaille comme assistant commercial pour une petite entreprise.'},
  {w:'bot',en:'Do you like your job?',fr:'Aimez-vous votre travail ?'},
  {w:'you',en:'Yes, I like it. I work in a team of five people.',fr:'Oui, je l’aime. Je travaille dans une équipe de cinq personnes.'},

  {w:'you',en:'My goal is to work with international clients.',fr:'Mon objectif est de travailler avec des clients internationaux.'}],

{id:'help',icon:'🆘',title:'Je ne comprends pas',sub:'Survival phrases',min:0,scn:'A colleague speaks fast and uses difficult words: practice asking for help and clarification',
 g:{t:'Demander poliment',h:'<b>Could you…?</b> / <b>Can you…?</b> + verbe de base. « Could » est plus poli. Pour ne pas comprendre : <b>I don’t understand</b> (après don’t, le verbe ne change jamais).',ex:['Could you repeat that, please?','Can you speak more slowly?','What does this word mean?']},
 phrases:[

  ['Could you say that again?','Pouvez-vous le redire ?',''],
  ['What does this word mean?','Que signifie ce mot ?',''],
  ['How do you say this in English?','Comment dit-on ceci en anglais ?','Quand un mot vous manque, demandez-le : c’est ainsi qu’on progresse.'],
  ['Can you give me an example?','Pouvez-vous me donner un exemple ?',''],
  ['Let me think for a moment.','Laissez-moi réfléchir un instant.','Gagnez du temps sans silence gênant.'],

  ['Is that correct?','Est-ce correct ?','']],

 dialogue:[
  {w:'bot',en:'Our deadline is next Tuesday, and we need the budget approved.',fr:'Notre échéance est mardi prochain et il faut valider le budget.'},
  {w:'you',en:'Sorry, I do not understand. Could you say that again?',fr:'Désolé, je ne comprends pas. Pouvez-vous le redire ?'},
  {w:'bot',en:'The deadline is Tuesday. We need to finish the budget.',fr:'L’échéance est mardi. Il faut finir le budget.'},
  {w:'you',en:'What does deadline mean?',fr:'Que signifie « deadline » ?'},
  {w:'bot',en:'It means the last day to finish something.',fr:'C’est le dernier jour pour finir quelque chose.'},
  {w:'you',en:'Ah, I understand. Thank you. Is that correct?',fr:'Ah, je comprends. Merci. Est-ce correct ?'}],
 talk:[['Someone speaks too fast. What do you say?','Sorry, could you …'],['You do not know a word. What do you say?','How do you say … in English?'],['Ask for an example.','Can you give me …']]},

{id:'numbers',icon:'🔢',title:'Chiffres, heures, dates',sub:'Numbers, time and dates',min:10,scn:'Giving and understanding numbers, prices, times and dates at work',
 g:{t:'L’heure, la date, les prix',h:'<b>at</b> + heure (at nine), <b>on</b> + jour (on Monday), <b>in</b> + mois (in June). Heures : <b>half past three</b> = 3 h 30, <b>a quarter to five</b> = 4 h 45. Attention : <b>fifteen</b> (accent à la fin) ≠ <b>fifty</b> (accent au début).',ex:['The meeting is at half past two.','See you on Tuesday.','It costs fifteen euros.']},
 phrases:[
  ['It is nine o’clock.','Il est neuf heures.',''],
  ['The meeting is at half past two.','La réunion est à deux heures et demie.',''],
  ['It costs fifteen euros.','Ça coûte quinze euros.','fifteen : accent sur la fin. fifty : accent sur le début.'],
  ['Can we meet on Tuesday?','Peut-on se voir mardi ?',''],

  ['I will call you in ten minutes.','Je vous rappelle dans dix minutes.',''],
  ['What time does it start?','À quelle heure ça commence ?','']],
 fill:[['The meeting is ___ Monday.',['on','at','in'],0,'on + jour de la semaine.'],['I start work ___ nine o’clock.',['at','on','in'],0,'at + heure.'],['My holiday is ___ August.',['in','on','at'],0,'in + mois.']],
 dialogue:[
  {w:'bot',en:'What time is the meeting?',fr:'À quelle heure est la réunion ?'},
  {w:'you',en:'The meeting is at half past two.',fr:'La réunion est à deux heures et demie.'},

  {w:'bot',en:'How much is the ticket?',fr:'Combien coûte le billet ?'},
  {w:'you',en:'It costs fifteen euros.',fr:'Ça coûte quinze euros.'}],
 talk:[['What time do you start and finish work?','I start at … and I finish at …'],['What is your date of birth?','My birthday is on the … of …'],['How much is your lunch or your phone?','It costs … euros.']]},

{id:'phone',icon:'📞',title:'Téléphone et e-mails',sub:'Phone and emails',min:22,scn:'A phone call with a company: ask for someone, explain why you call, leave a message',
 g:{t:'Promettre avec « will »',h:'<b>I will + verbe de base</b> pour promettre ou décider : « I will send you an email ». <b>Can I…?</b> pour demander l’autorisation : « Can I speak to Mr Smith? »',ex:['I will call you tomorrow.','Can I speak to Mr Smith?']},
 phrases:[

 fill:[['I ___ send you an email.',['will','am','do'],0,'will + verbe = promesse.'],['Can I ___ to Mr Smith?',['speak','speaks','speaking'],0,'Can I + verbe de base.'],['I am calling ___ your order.',['about','for','to'],0,'call about = appeler au sujet de.']],
 dialogue:[
  {w:'bot',en:'Good morning, Alpha Company. How can I help you?',fr:'Bonjour, société Alpha. Comment puis-je vous aider ?'},

let spk=0;
function speak(text,rate=.85){
  return new Promise(res=>{
    try{
      if(!('speechSynthesis' in window)){res();return}
      const go=()=>{
        try{
          const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;
          const v=voices.find(v=>v.lang==='en-US'&&/samantha|aaron|google|natural/i.test(v.name))||voices.find(v=>v.lang==='en-US')||voices[0];if(v)u.voice=v;
          let fin=false,started=false;const done=()=>{if(!fin){fin=true;res()}};
          u.onstart=()=>{started=true};u.onend=done;u.onerror=done;
          setTimeout(done,Math.max(4000,text.length*160/rate));                 // garde-fou : ne jamais bloquer
          setTimeout(()=>{if(!started&&!fin){try{speechSynthesis.cancel()}catch(e){}toast('🔇 Pas de son ? Désactivez le mode silencieux (interrupteur sur le côté de l’iPhone), montez le volume, puis touchez 🔊.',8000);done()}},2500);
          try{speechSynthesis.resume()}catch(e){}
          speechSynthesis.speak(u);
        }catch(e){res()}
      };
      if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,120)}else go();
    }catch(e){res()}
  });
}

let REC=null;
// Reconnaissance vocale protégée : fin d'écoute, délai maximum, erreurs de démarrage.
function listen(){
  return new Promise((res,rej)=>{
    if(!SR||srDead){rej('unsupported');return}
    try{speechSynthesis.cancel()}catch(e){}
    try{REC&&REC.abort()}catch(e){}
    let done=false,tm,r;
    const fin=f=>{if(done)return;done=true;clearTimeout(tm);try{r.abort()}catch(e){};f()};
    try{r=new SR()}catch(e){rej('unsupported');return}
    REC=r;r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;r.continuous=false;
    tm=setTimeout(()=>fin(()=>rej('timeout')),12000);
    r.onresult=e=>{try{const a=Array.from(e.results[0]).map(x=>x.transcript);a.conf=e.results[0][0].confidence||null;fin(()=>res(a))}catch(x){fin(()=>rej('nomatch'))}};
    r.onerror=e=>fin(()=>rej((e&&e.error)||'error'));
    r.onnomatch=()=>fin(()=>rej('nomatch'));
    r.onend=()=>setTimeout(()=>fin(()=>rej('nomatch')),400);
    setTimeout(()=>{try{r.start()}catch(e){fin(()=>rej('start'))}},350);   // laisse l'audio iPhone passer de la voix au micro
  });
}
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
function compare(target,heard){
  const t=norm(target),h=norm(heard);
  const dp=Array.from({length:t.length+1},()=>Array(h.length+1).fill(0));
  for(let i=1;i<=t.length;i++)for(let j=1;j<=h.length;j++)dp[i][j]=t[i-1]===h[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const hit=new Set();let i=t.length,j=h.length;
  while(i>0&&j>0){if(t[i-1]===h[j-1]){hit.add(i-1);i--;j--}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--}
  return {score:t.length?Math.round(100*hit.size/t.length):0,html:t.map((w,k)=>`<span class="${hit.has(k)?'w-ok':'w-bad'}">${esc(w)}</span>`).join(' ')};
}
async function bestMatch(target){
  const alts=await listen();let best=null;
  for(const a of alts){const c=compare(target,a);c.heard=a;c.conf=alts.conf;if(!best||c.score>best.score)best=c}
  return best;
}

  if(e==='unsupported')return 'Reconnaissance vocale indisponible ici. Utilisez Safari, Chrome ou Edge, ou tapez votre réponse.';
  if(e==='audio-capture')return 'Aucun micro détecté.';
  return 'Je n’ai rien entendu. Appuyez sur 🎤, attendez une seconde, puis parlez clairement.';
}

function drawNav(){$('nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')}
function go(t){tab=t;cur=null;spk++;try{speechSynthesis.cancel()}catch(e){}render()}
function render(){
  head();drawNav();window.scrollTo(0,0);
  if(!S.tested){return vWelcome()}
  ({home:vHome,course:vCourse,chat:vChat,dico:vDico,cards:vCards,prog:vProg})[tab]();
}
const ring=(p,size=92,w=9,col='#fff',bg='rgba(255,255,255,.25)')=>{const r=(size-w)/2,c=2*Math.PI*r;return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${bg}" stroke-width="${w}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}"/></svg>`};

/* ============================ ACCUEIL & TEST DE NIVEAU ============================ */
function vWelcome(){
  $('view').innerHTML=`<div class="hero" style="flex-direction:column;align-items:flex-start;gap:8px"><div class="big">Bienvenue 👋<br>Parlons anglais !</div><small>Votre professeur de poche : cours, exercices, conversation à la voix et corrections, à votre niveau.</small></div>
  <div class="card"><h3>Commençons par un test de niveau</h3><p class="mute">Environ 5 minutes : 16 questions qui s’adaptent à vos réponses (grammaire, vocabulaire, écoute, lecture) puis une courte épreuve orale. Il mesure votre vrai niveau et règle le cours et la vitesse du tuteur. Répondez sans tricher : « je ne sais pas » est permis.</p>
  ${S.plSave?`<button class="btn primary big" onclick="resumePl()">Reprendre mon test (question ${Math.min(S.plSave.n+1,16)}/16)</button><button class="btn big" style="margin-top:8px" onclick="startPlacement()">Recommencer le test</button>`:`<button class="btn primary big" onclick="startPlacement()">Faire le test de niveau</button>`}
  <div class="row"><button class="btn ghost" onclick="S.tested=true;S.placed=true;save();render()">Passer le test (je garde mon niveau actuel)</button></div></div>`;
}
let PL=null;
const SKN={g:'🔤 Grammaire',v:'📖 Vocabulaire',l:'🎧 Écoute',r:'📄 Lecture'},PL_N=16;
function savePl(phase){S.plSave={phase,n:PL.n,d:PL.d,ds:PL.ds,best:PL.best,ask:PL.ask,used:[...PL.used].map(x=>PLB.indexOf(x)),oral:PL.oral,os:PL.os||null,oi:PL.oi||0};save()}
function resumePl(){const r=S.plSave;if(!r)return startPlacement();PL={n:r.n,d:r.d,ds:r.ds,best:r.best,ask:r.ask,used:new Set(r.used.map(i=>PLB[i])),oral:r.oral||[],os:r.os,oi:r.oi||0};$('nav').style.display='none';if(r.phase==='oral'&&PL.os)showOral();else nextPl()}
function startPlacement(){S.plSave=null;PL={n:0,d:2,used:new Set(),ds:[],best:{g:-1,v:-1,c:-1},ask:{g:0,v:0,l:0,r:0},oral:[]};$('nav').style.display='none';nextPl()}
function pickPl(){
  for(const k of [0,1,-1,2,-2,3,-3,4,-4,5]){
    const d=PL.d+k;if(d<0||d>5)continue;
    const c=PLB.filter(x=>x.d===d&&!PL.used.has(x));
    if(c.length){const m=Math.min(...c.map(x=>PL.ask[x.k]));return sh(c.filter(x=>PL.ask[x.k]===m))[0]}
  }
  return null;
}
function nextPl(){
  if(PL.n>=PL_N||!pickPl())return startOral();
  const it=PL.cur=pickPl();PL.used.add(it);PL.ask[it.k]++;
  const o=sh(it.o.map((x,i)=>[x,i]));
  $('view').innerHTML=`<div class="card"><div class="mute">Question ${PL.n+1}/${PL_N} · ${SKN[it.k]}</div><div class="bar" style="margin:6px 0 12px"><i style="width:${PL.n/PL_N*100}%"></i></div>
  ${it.k==='l'?`<div class="en" style="font-size:19px">Écoutez puis répondez.</div><div class="row"><button class="btn" onclick="sp(${T(it.txt)})">🔊 Écouter</button><button class="btn" onclick="sp(${T(it.txt)},1)">🐢 Lent</button><button class="btn ghost" onclick="this.outerHTML='<div class=tip style=margin:0;width:100%>'+esc(_t[${T(it.txt)}])+'</div>'">Je n’entends pas : voir le texte</button></div><div class="mute" style="margin-top:8px">${esc(it.q)}</div>`
   :it.k==='r'?`<div class="tip" style="margin:0 0 10px;font-size:17px">${esc(it.txt)}</div><div style="font-weight:800">${esc(it.q)}</div>`
   :`<div class="en" style="font-size:22px">${esc(it.q).replace('___','<span class="blank">___</span>')}</div>`}
  ${o.map(([x,i])=>`<button class="opt" onclick="plPick(${i})">${esc(x)}</button>`).join('')}
  <button class="btn ghost" style="margin-top:10px" onclick="plPick(-1)">Je ne sais pas</button></div>`;
  if(it.k==='l')sp(T(it.txt),1);
}
function plPick(i){
  const it=PL.cur,ok=i===it.a,k=it.k==='g'||it.k==='v'?it.k:'c';
  PL.ds.push(PL.d);if(ok&&it.d>PL.best[k])PL.best[k]=it.d;
  PL.d=ok?Math.min(5,PL.d+1):Math.max(0,PL.d-1);PL.n++;savePl('mcq');nextPl();
}
const plEst=()=>{const a=PL.ds.slice(-10).concat(PL.d),e=a.reduce((x,y)=>x+y,0)/a.length;return Math.max(0,Math.min(5,e))};
const plLvl=e=>{const i=Math.min(4,Math.floor(e));return PL_PTS[i]+(PL_PTS[i+1]-PL_PTS[i])*(e-i)};
function startOral(){PL.oi=0;const b=Math.max(0,Math.min(2,Math.round(plEst()/5*3)));PL.os=ORAL.slice(b,b+3);savePl('oral');showOral()}
function showOral(){
  if(PL.oi>=PL.os.length)return finishPl();
  const t=PL.os[PL.oi];
  $('view').innerHTML=`<div class="card"><div class="mute">Épreuve orale · phrase ${PL.oi+1}/${PL.os.length}</div><div class="bar" style="margin:6px 0 12px"><i style="width:${PL.oi/PL.os.length*100}%"></i></div>
   <div style="font-weight:800">Lisez cette phrase à voix haute :</div><div class="en" style="margin:8px 0">${esc(t)}</div>
   <div class="row"><button class="btn" onclick="sp(${T(t)})">🔊 Écouter</button><button class="mic" id="mic" onclick="oralTry()">🎤</button></div>
   <div class="score" id="res">${canMic()?'Appuyez sur 🎤 puis lisez la phrase.':esc(errMsg('unsupported'))}</div>
   <div class="row"><button class="btn ghost" onclick="PL.os=[];showOral()">Passer l’épreuve orale</button></div></div>`;
}
async function oralTry(){
  const t=PL.os[PL.oi],m=$('mic'),r=$('res');
  if(!canMic()){r.textContent=errMsg('unsupported');return}
  m.classList.add('rec');r.textContent='Je vous écoute… parlez !';
  try{const c=await bestMatch(t);PL.oral.push(c.score);r.innerHTML=`<b>${c.score}%</b> ${c.html}`;m.classList.remove('rec');setTimeout(()=>{PL.oi++;savePl('oral');showOral()},1400);return}
  catch(e){r.textContent=errMsg(e)}
  m.classList.remove('rec');
}
function finishPl(){
  const e=plEst();let lvl=plLvl(e);
  const sc=PL.oral.length?Math.round(PL.oral.reduce((a,b)=>a+b,0)/PL.oral.length):null;
  if(sc!==null)lvl+=(sc-75)/100*8;
  lvl=Math.max(5,Math.min(90,lvl));
  S.plSave=null;S.lvl=lvl;S.tested=true;S.placed=true;S.tests=(S.tests||[]).concat([{d:today(),l:Math.round(lvl)}]);save();addXP(20);
  $('nav').style.display='';drawNav();confetti();
  const lab=d=>d<0?'A1 −':CEFR[d];
  $('view').innerHTML=`<div class="hero"><div class="ring">${ring(S.lvl)}<b>${Math.round(S.lvl)}</b></div><div class="t"><small>Votre niveau mesuré</small><div class="big">${lvlName()}</div><small>sur ${PL.n} questions${sc!==null?' et un oral':''}</small></div></div>
  <div class="card"><h3>Détail par compétence</h3>
   <div class="grid2" style="margin-top:10px"><div class="stat"><b>${lab(PL.best.g)}</b>Grammaire</div><div class="stat"><b>${lab(PL.best.v)}</b>Vocabulaire</div>
   <div class="stat"><b>${lab(PL.best.c)}</b>Compréhension</div><div class="stat"><b>${sc!==null?sc+'%':'—'}</b>Oral${sc===null?' (passé)':''}</div></div>
   <p class="mute">Niveau le plus élevé réussi dans chaque compétence. Ce test est indicatif : le tuteur ajuste votre niveau à chaque conversation, et vous pouvez le refaire dans l’onglet Progrès.</p>
   <button class="btn primary big" onclick="go('home')">Commencer mon parcours</button></div>`;
}

// Unité conseillée : la première non terminée qui n'est pas trop en dessous du niveau mesuré.
const recIdx=()=>{let i=UNITS.findIndex((u,k)=>u.job&&unlocked(k)&&pct(u)<100&&u.min>=S.lvl-30);if(i<0)i=UNITS.findIndex((u,k)=>unlocked(k)&&pct(u)<100&&u.min>=S.lvl-30);if(i<0)i=UNITS.findIndex((u,k)=>unlocked(k)&&pct(u)<100);return i<0?UNITS.length-1:i};
function vHome(){
  const d=dayRec(),due=dueCards().length,ui=recIdx(),u=UNITS[ui];
  const s1=d.rev||due===0,s2=d.learn,s3=d.turns>=3,n=[s1,s2,s3].filter(Boolean).length;
  const h=new Date().getHours();
  $('view').innerHTML=`<div class="hero"><div class="ring">${ring(S.lvl)}<b>${Math.round(S.lvl)}</b></div>
   <div class="t"><small>${h<18?'Bonjour':'Bonsoir'} ! Votre niveau</small><div class="big">${lvlName()}</div><small>${nextGoal()}</small></div></div>
  <div class="card"><div class="row" style="margin:0 0 8px;justify-content:space-between"><h3>Votre séance du jour</h3><span class="pill" style="box-shadow:none;background:var(--soft)">${n}/3</span></div>
   <div class="step ${s1?'done':''}"><div class="ic">${s1?'✓':'🃏'}</div><div class="tx"><b>Réviser</b><span class="mute">${due?due+' phrase'+(due>1?'s':'')+' à revoir':'Rien à réviser pour l’instant'}</span></div>${s1?'':'<button class="btn primary" onclick="go(\'cards\')">Go</button>'}</div>
   <div class="step ${s2?'done':''}"><div class="ic">${s2?'✓':u.icon}</div><div class="tx"><b>Apprendre : ${esc(u.title)}</b><span class="mute">${pct(u)}% de l’unité</span></div>${s2?'':`<button class="btn primary" onclick="openUnit('${u.id}')">Go</button>`}</div>
   <div class="step ${s3?'done':''}"><div class="ic">${s3?'✓':'🤖'}</div><div class="tx"><b>Parler avec le tuteur</b><span class="mute">${s3?'Bravo !':'3 réponses à voix haute ('+Math.min(d.turns,3)+'/3)'}</span></div>${s3?'':`<button class="btn primary" onclick="scen='${u.id}';go('chat')">Go</button>`}</div>
  </div>
  <div class="card"><h3>💡 Conseil du professeur</h3><p style="margin:6px 0 0">${TIPS[new Date().getDate()%TIPS.length]}</p></div>`;
}

/* ============================ COURS ============================ */
function vCourse(){
  if(cur)return vUnit(cur);
  const node=(u,i)=>{const ok=unlocked(i),p=pct(u);
    return `<div class="card node ${ok?'':'lock'}" ${ok?`onclick="openUnit('${u.id}')"`:''}><div class="ic">${ring(p,62,5,'var(--ok)','var(--line)')}${ok?u.icon:'🔒'}</div>
    <div style="flex:1;min-width:0"><h3>${u.title}</h3><div class="mute">${ok?u.sub+' · '+p+'%'+(i===recIdx()?' · ⭐ Conseillé pour vous':''):'Se débloque au niveau '+u.min+' ou en finissant l’unité précédente'}</div></div></div>`};
  const gen=UNITS.map((u,i)=>[u,i]).filter(x=>!x[0].job),job=UNITS.map((u,i)=>[u,i]).filter(x=>x[0].job);
  $('view').innerHTML=`<h2>Ateliers gratuits</h2><div class="grid2" style="margin-bottom:14px">
   <div class="card node" style="flex-direction:column;text-align:center;margin:0" onclick="vPronList()"><div class="ic">🗣️</div><h3>Prononciation</h3><div class="mute">7 sons pièges</div></div>
   <div class="card node" style="flex-direction:column;text-align:center;margin:0" onclick="vSceneList()"><div class="ic">💬</div><h3>Mini-conversations</h3><div class="mute">${SCENES.length} situations</div></div>
   <div class="card node" style="flex-direction:column;text-align:center;margin:0;grid-column:span 2" onclick="startComp()"><div class="ic">🎧</div><h3>Compréhension</h3><div class="mute">Écoute et lecture adaptées à votre niveau</div></div></div>
  <h2>💼 Votre métier : ${esc(S.job||'finance')}</h2><div class="path" style="margin-bottom:14px">${job.map(x=>node(x[0],x[1])).join('')}
   <div class="card node" onclick="dsub='fin';go('dico')"><div class="ic">📚</div><div style="flex:1"><h3>Glossaire finance</h3><div class="mute">${GLOS.length} termes de contrôle de gestion</div></div></div></div>
  <h2>Votre parcours général</h2><div class="path">${gen.map(x=>node(x[0],x[1])).join('')}</div>`;
}
function openUnit(id){cur=unit(id);tab='course';drawNav();vUnit(cur)}
function vUnit(u){
  const d=S.done[u.id]||{};
  $('view').innerHTML=`<a class="back" onclick="go('course')">← Parcours</a><h2>${u.icon} ${u.title}</h2>
  ${STAGES.map(([k,l],i)=>{const fn=['startLearn','startEx','startDialogue','startTalk'][i],sub=['Grammaire + '+u.phrases.length+' phrases à répéter','12 exercices variés','Jeu de rôle à voix haute','Questions ouvertes guidées'][i];
   return `<div class="step ${d[k]?'done':''}" onclick="${fn}()" style="cursor:pointer"><div class="ic">${d[k]?'✓':i+1}</div><div class="tx"><b>${l}</b><span class="mute">${sub}</span></div><span class="mute">›</span></div>`}).join('')}
  <button class="btn primary big" style="margin-top:6px" onclick="scen='${u.id}';go('chat')">🤖 Discuter de ce thème avec le tuteur</button>`;
}
const back=u=>`<a class="back" onclick="openUnit('${u.id}')">← ${u.title}</a>`;

/* --- Découvrir : grammaire puis phrases --- */
function startLearn(){const u=cur;
  $('view').innerHTML=`${back(u)}<div class="card"><div class="mute">Le point de cours</div><h2 style="margin-top:2px">${u.g.t}</h2><p>${u.g.h}</p>
  ${u.g.ex.map(e=>`<div class="tip" style="display:flex;gap:8px;align-items:center"><span style="flex:1">${esc(e)}</span><button class="btn" onclick="sp(${T(e)})">🔊</button></div>`).join('')}
  <button class="btn primary big" style="margin-top:14px" onclick="pi=0;shPhrase()">Compris, écouter les phrases →</button></div>`;
}
let pi=0;
function shPhrase(){
  const u=cur,[en,fr,tip]=u.phrases[pi];S.cards[en]=S.cards[en]||{box:0,due:0};
  $('view').innerHTML=`${back(u)}<div class="card"><div class="mute">Phrase ${pi+1}/${u.phrases.length}</div><div class="bar" style="margin:6px 0 12px"><i style="width:${pi/u.phrases.length*100}%"></i></div>
   <div class="en">${esc(en)}</div><div class="fr">${esc(fr)}</div>${tip?`<div class="tip">💡 ${esc(tip)}</div>`:''}
   <div class="row"><button class="btn" onclick="sp(${T(en)})">🔊 Écouter</button><button class="btn" onclick="sp(${T(en)},1)">🐢 Lent</button>
    <button class="mic" id="mic" onclick="tryPhrase()">🎤</button></div>
   <div class="score" id="res">1) Écoutez 2) appuyez sur 🎤 et dites la phrase.</div>
   <div class="row"><button class="btn" ${pi?'':'disabled'} onclick="pi--;shPhrase()">←</button>
   <button class="btn primary" style="flex:1" onclick="nextPhrase()">${pi<u.phrases.length-1?'Suivant →':'Terminer ✔'}</button></div></div>`;
  sp(T(en));
}
function nextPhrase(){if(pi<cur.phrases.length-1){pi++;shPhrase()}else{addXP(20,cur.id,'learn');bump(.5);confetti();toast('Bravo ! +20 points 🎉',2500);openUnit(cur.id)}}
async function tryPhrase(){
  const en=cur.phrases[pi][0],m=$('mic'),r=$('res');
  if(!canMic()){r.innerHTML=`${srDead?esc(errMsg('service-not-allowed'))+'<br>':''}Dites la phrase à voix haute puis évaluez-vous : <div class="row"><button class="btn ok" onclick="selfEval(true)">Bien dit</button><button class="btn bad" onclick="selfEval(false)">À refaire</button></div>`;return}
  m.classList.add('rec');r.textContent='Je vous écoute… parlez !';
  try{const c=await bestMatch(en);
    r.innerHTML=`<b style="font-size:22px">${c.score}%</b> ${verdict(c.score)}<br>${c.html}<div class="mute">J’ai entendu : « ${esc(c.heard)} »</div>`;
    if(c.score>=70){addXP(2);bump(.15);rate(en,true)}else rate(en,false)}
  catch(e){r.textContent=errMsg(e)}
  m.classList.remove('rec');
}
function selfEval(ok){rate(cur.phrases[pi][0],ok);if(ok)addXP(2);$('res').textContent=ok?'👍 Bien !':'Réessayez avec le modèle lent 🐢.'}

/* --- S'entraîner : exercices variés --- */
let EX=null;
function genEx(u){
  const P=u.phrases,L=[],pick=(n,f)=>sh(P.filter(f||(()=>true))).slice(0,n);
  const opts=(c,k)=>{const o=sh([c,...sh(P.filter(p=>p[k]!==c)).slice(0,2).map(p=>p[k])]);return {o,a:o.indexOf(c)}};
  pick(3).forEach(p=>{const{o,a}=opts(p[0],0);L.push({t:'mcq',q:`Comment dit-on : <b>${esc(p[1])}</b> ?`,o,a,ans:p[0],say:p[0],card:p[0]})});
  pick(2).forEach(p=>{const{o,a}=opts(p[1],1);L.push({t:'mcq',q:'🔊 Écoutez, puis choisissez le sens.',o,a,ans:p[1],say:p[0],auto:1,card:p[0]})});
  pick(2,p=>p[0].split(' ').length>=4).forEach(p=>L.push({t:'order',fr:p[1],en:p[0],card:p[0]}));
  pick(2).forEach(p=>L.push({t:'dict',en:p[0],card:p[0]}));
  u.fill.forEach(f=>L.push({t:'mcq',q:`Complétez : <b>${esc(f[0]).replace('___','<span class="blank">___</span>')}</b>`,o:f[1],a:f[2],ans:f[1][f[2]],why:f[3]}));
  return sh(L);
}
function startEx(){EX={u:cur,list:genEx(cur),i:0,ok:0,lock:false};showEx()}
function showEx(){
  const e=EX.list[EX.i];if(!e)return endEx();EX.lock=false;EX.cur=e;
  const head=`${back(EX.u)}<div class="card"><div class="mute">Exercice ${EX.i+1}/${EX.list.length}</div><div class="bar" style="margin:6px 0 12px"><i style="width:${EX.i/EX.list.length*100}%"></i></div>`;
  if(e.t==='mcq'){
    $('view').innerHTML=head+`<div style="font-size:19px;font-weight:800">${e.q}</div>${e.say?`<div class="row"><button class="btn" onclick="sp(${T(e.say)})">🔊 Écouter</button><button class="btn" onclick="sp(${T(e.say)},1)">🐢</button></div>`:''}
    ${e.o.map((x,i)=>`<button class="opt" id="o${i}" onclick="exPick(${i})">${esc(x)}</button>`).join('')}<div id="fbk"></div></div>`;
    if(e.auto)sp(T(e.say));
  }else if(e.t==='order'){
    e.pool=sh(e.en.split(' ').map((w,i)=>({w,i})));e.ans=[];drawOrder();
  }else{
    $('view').innerHTML=head+`<div style="font-size:19px;font-weight:800">✍️ Dictée : écoutez et écrivez ce que vous entendez.</div>
    <div class="row"><button class="btn" onclick="sp(${T(e.en)})">🔊 Écouter</button><button class="btn" onclick="sp(${T(e.en)},1)">🐢 Lent</button></div>
    <input type="text" id="dic" style="width:100%;margin-top:12px" placeholder="Tapez la phrase en anglais" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn primary big" style="margin-top:10px" onclick="dictCheck()">Vérifier</button><div id="fbk"></div></div>`;
    sp(T(e.en),1);
  }
}
function drawOrder(){
  const e=EX.cur;
  $('view').innerHTML=`${back(EX.u)}<div class="card"><div class="mute">Exercice ${EX.i+1}/${EX.list.length}</div><div class="bar" style="margin:6px 0 12px"><i style="width:${EX.i/EX.list.length*100}%"></i></div>
  <div style="font-size:19px;font-weight:800">Remettez la phrase dans l’ordre :</div><div class="fr" style="margin:4px 0">${esc(e.fr)}</div>
  <div class="chips">${e.ans.map((c,k)=>`<button class="chip" onclick="ordDel(${k})">${esc(c.w)}</button>`).join('')}</div>
  <div class="chips" style="border:0;padding:8px 0">${e.pool.map((c,k)=>`<button class="chip" onclick="ordAdd(${k})">${esc(c.w)}</button>`).join('')}</div>
  <button class="btn primary big" ${e.pool.length?'disabled':''} onclick="ordCheck()">Vérifier</button><div id="fbk"></div></div>`;
}
function ordAdd(k){if(EX.lock)return;const e=EX.cur;e.ans.push(e.pool.splice(k,1)[0]);drawOrder()}
function ordDel(k){if(EX.lock)return;const e=EX.cur;e.pool.push(e.ans.splice(k,1)[0]);drawOrder()}
function ordCheck(){if(EX.lock)return;const e=EX.cur,got=e.ans.map(c=>c.w).join(' ');exDone(norm(got).join(' ')===norm(e.en).join(' '),e.en)}
function dictCheck(){if(EX.lock)return;const e=EX.cur,v=$('dic').value,c=compare(e.en,v);exDone(c.score>=90&&norm(v).length<=norm(e.en).length+1,e.en,c.html)}
function exPick(i){
  if(EX.lock)return;const e=EX.cur;
  $('o'+e.a).classList.add('right');if(i!==e.a)$('o'+i).classList.add('wrong');

async function bilan(){
  const el=$('extra');if(busy)return;
  const turns=chat.filter(m=>m.role==='user'&&m.content!=='[start]').length;
  if(turns<2){el.innerHTML='<div class="mute">Répondez au moins 2 fois avant de demander le bilan.</div>';return}
  el.innerHTML='<div class="mute">📝 Votre professeur prépare le bilan…</div>';
  const tr=chat.map(m=>(m.role==='user'?'LEARNER: ':'TUTOR: ')+((m.role==='assistant'&&jsonOf(m.content))?jsonOf(m.content).reply:m.content)).join('\n');
  try{const raw=await api(`You are an English teacher giving a French-speaking learner (score ${Math.round(S.lvl)}/100; 35=A2) feedback after a conversation. Return ONLY JSON: {"summary":"2 encouraging sentences in French","strengths":["up to 3 short points in French"],"focus":[{"en":"corrected example sentence","why":"short French rule"}] (up to 3, the recurring mistakes),"homework":"one concrete task in French for tomorrow","score":0-100 CEFR level shown overall}`,[{role:'user',content:tr}],900);
    const d=jsonOf(raw);if(!d)throw new Error('Réponse illisible, réessayez.');
    if(typeof d.score==='number')bump((d.score-S.lvl)*.2);S.convos++;addXP(15);confetti();
    (d.focus||[]).forEach(f=>{if(f&&f.en){S.cards[f.en]=S.cards[f.en]||{box:0,due:0};S.extra[f.en]=f.why||'';rate(f.en,false)}});save();
    el.innerHTML=`<div class="card" style="margin:12px 0 0;background:var(--soft)"><h3>📝 Bilan de la séance</h3><p>${esc(d.summary||'')}</p>
    ${(d.strengths||[]).length?'<b>Points forts</b><ul style="margin:4px 0 8px;padding-left:20px">'+d.strengths.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':''}
    ${(d.focus||[]).length?'<b>À retravailler</b>'+d.focus.map(f=>`<div class="tip" style="background:var(--card)"><b>${esc(f.en)}</b><div class="mute">${esc(f.why||'')}</div></div>`).join('')+'<div class="mute">Ces phrases sont ajoutées à votre révision.</div>':''}
    ${d.homework?`<p><b>Devoir pour demain :</b> ${esc(d.homework)}</p>`:''}
    <p class="mute">Niveau estimé : <b>${lvlName()}</b> (${Math.round(S.lvl)}/100) · +15 points</p><button class="btn primary" onclick="chat=[];logHTML='';fb=[];vChat()">Nouvelle conversation</button></div>`;
  }catch(e){el.innerHTML=`<div class="mute">⚠️ ${esc(e.message)}</div>`}
}

function vPronList(){
  $('view').innerHTML=`${atelierBack}<h2>🗣️ Prononciation</h2><p class="mute">Les sons qui piègent les francophones. Écoutez, distinguez, puis répétez.</p>

}
let PR=null;
function startPron(id){const l=PRON.find(x=>x.id===id);PR={l,i:0,ok:0,list:sh(l.pairs.concat(sh(l.pairs).slice(0,2))).map(p=>{const k=Math.random()<.5?0:1;return {p,k}})};
  $('view').innerHTML=`<a class="back" onclick="vPronList()">← Prononciation</a><div class="card"><h2>${l.t}</h2><p>${esc(l.tip)}</p>
  ${l.pairs.slice(0,3).map(p=>`<div class="tip" style="display:flex;gap:8px;align-items:center"><b style="flex:1">${p[0]} · ${p[1]}</b><button class="btn" onclick="sp(${T(p[0])},1)">${p[0]}</button><button class="btn" onclick="sp(${T(p[1])},1)">${p[1]}</button></div>`).join('')}
  <button class="btn primary big" style="margin-top:14px" onclick="showPron()">S’entraîner (8 écoutes)</button></div>`}
function showPron(){
  if(PR.i>=PR.list.length)return endPron();
  const r=PR.list[PR.i],w=r.p[r.k];
  $('view').innerHTML=`<a class="back" onclick="vPronList()">← Prononciation</a><div class="card"><div class="mute">Écoute ${PR.i+1}/${PR.list.length}</div><div class="bar" style="margin:6px 0 12px"><i style="width:${PR.i/PR.list.length*100}%"></i></div>
  <div style="font-size:19px;font-weight:800">Quel mot entendez-vous ?</div><div class="row"><button class="btn" onclick="sp(${T(w)},1)">🔊 Écouter</button></div>
  <button class="opt" id="p0" onclick="pronPick(0)">${r.p[0]}</button><button class="opt" id="p1" onclick="pronPick(1)">${r.p[1]}</button><div id="fbk"></div></div>`;
  setTimeout(()=>sp(T(w),1),300);
}
function pronPick(i){
  if(PR.lock)return;PR.lock=true;const r=PR.list[PR.i],ok=i===r.k;
  $('p'+r.k).classList.add('right');if(!ok)$('p'+i).classList.add('wrong');
  if(ok){PR.ok++;addXP(1)}
  $('fbk').innerHTML=`<div class="fbk ${ok?'ok':'no'}"><b>${ok?'✅ Bien entendu !':'❌ C’était « '+r.p[r.k]+' ».'}</b><div class="row"><button class="btn" onclick="sp(${T(r.p[0])},1)">${r.p[0]}</button><button class="btn" onclick="sp(${T(r.p[1])},1)">${r.p[1]}</button></div><button class="btn primary big" style="margin-top:10px" onclick="PR.lock=false;PR.i++;showPron()">Continuer</button></div>`;
}
function endPron(){
  const a=Math.round(100*PR.ok/PR.list.length);S.pron=S.pron||{};S.pron[PR.l.id]=Math.max(S.pron[PR.l.id]||0,a);
  addXP(10,'atelier','pron');bump(.3);if(a>=80)confetti();
  $('view').innerHTML=`<a class="back" onclick="vPronList()">← Prononciation</a><div class="card" style="text-align:center"><div style="font-size:54px">${a>=80?'🏆':'💪'}</div><h2>${a}% bien entendus</h2><p class="mute">Maintenant, répétez : le micro vérifie ce qu’il comprend.</p>
  <button class="btn primary" onclick="repPron()">🎤 Répéter 4 mots</button> <button class="btn" onclick="startPron('${PR.l.id}')">Refaire</button></div>`;
}

function startScene(id){SC={c:SCENES.find(x=>x.id===id),i:0,ok:0};showScene()}

  if(SC.i>=SC.c.steps.length){

function scPick(i){
  if(SC.lock)return;SC.lock=true;const o=SC.opts[i],good=SC.opts.findIndex(x=>x[1]===1);
  $('s'+good).classList.add('right');if(!o[1])$('s'+i).classList.add('wrong');

  const g=SC.opts[good][0];
  $('fbk').innerHTML=`<div class="fbk ${o[1]?'ok':'no'}"><b>${o[1]?'✅ Excellente réponse !':'❌ Pas idéal.'}</b>${o[1]?'':`<div>${esc(o[2])}</div><div style="margin-top:6px">La meilleure : <b>${esc(g)}</b></div>`}
  <div class="row"><button class="btn" onclick="sp(${T(g)})">🔊</button><button class="btn" onclick="scSay(${T(g)})">🎤 Dire la bonne réponse</button><span id="scr"></span></div>
  <button class="btn primary big" style="margin-top:10px" onclick="SC.i++;showScene()">Suite →</button></div>`;

async function scSay(i){

const DBL=new Set(['stop','plan','run','get','put','sit','begin','swim','cut','hit','let','set','shut','win','forget','prefer','admit','drop','travel','quit','hug','jog']);
function pastReg(b){return b.endsWith('e')?b+'d':/[^aeiou]y$/.test(b)?b.slice(0,-1)+'ied':DBL.has(b)?b+b.slice(-1)+'ed':b+'ed'}
function enForms(v){
  const b=v.b;let s3,ing;
  if(b==='be'){s3='is';ing='being'}
  else{
    s3=b==='have'?'has':b==='do'?'does':b==='go'?'goes':/(s|x|z|ch|sh|o)$/.test(b)?b+'es':/[^aeiou]y$/.test(b)?b.slice(0,-1)+'ies':b+'s';
    ing=b.endsWith('ie')?b.slice(0,-2)+'ying':/[^eoy]e$/.test(b)?b.slice(0,-1)+'ing':DBL.has(b)?b+b.slice(-1)+'ing':b+'ing';
  }
  return {b,s3,ing,past:v.p||pastReg(b),pp:v.pp||pastReg(b)};
}
const SUBJ=['I','you','he/she/it','we','you','they'];
const CONTR={'do not':"don't",'does not':"doesn't",'did not':"didn't",'have not':"haven't",'has not':"hasn't",'had not':"hadn't",'will not':"won't",'would not':"wouldn't",'is not':"isn't",'are not':"aren't",'was not':"wasn't",'were not':"weren't"};
function enBuild(f,id,k){
  const be=f.b==='be',bePres=['am','are','is','are','are','are'][k],bePast=['was','were','was','were','were','were'][k],have=k===2?'has':'have',base=f.b;
  switch(id){
    case 'ps':return be?{aux:bePres,rest:''}:{simple:1,v:k===2?f.s3:base,doAux:k===2?'does':'do',base};
    case 'pc':return {aux:bePres,rest:f.ing};
    case 'pas':return be?{aux:bePast,rest:''}:{simple:1,v:f.past,doAux:'did',base};
    case 'pac':return {aux:bePast,rest:f.ing};
    case 'pp':return {aux:have,rest:f.pp};
    case 'ppc':return {aux:have,rest:'been '+f.ing};
    case 'pap':return {aux:'had',rest:f.pp};
    case 'fs':return {aux:'will',rest:base};
    case 'fg':return {aux:bePres,rest:'going to '+base};
    case 'fp':return {aux:'will',rest:'have '+f.pp};
    case 'co':return {aux:'would',rest:base};
    default:return {aux:'would',rest:'have '+f.pp};
  }
}
function enSentence(f,id,k,mode){
  const o=enBuild(f,id,k),s=SUBJ[k];
  if(o.simple){
    if(mode==='aff')return `${s} ${o.v}`;
    if(mode==='neg')return `${s} ${CONTR[o.doAux+' not']} ${o.base}`;
    return `${cap(o.doAux)} ${s} ${o.base}?`;
  }
  const r=o.rest?' '+o.rest:'';
  if(mode==='aff')return `${s} ${o.aux}${r}`;
  if(mode==='neg')return `${s} ${CONTR[o.aux+' not']||o.aux+' not'}${r}`;
  return `${cap(o.aux)} ${s}${r}?`;
}

function localFind(q){
  const out=[];
  VERBS.forEach(v=>{const f=enForms(v);if([v.b,f.s3,f.ing,f.past,f.pp].includes(q))out.push(v)});
  return out;
}
function exampleFind(q){
  const r=[],re=new RegExp('\\b'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
  UNITS.forEach(u=>u.phrases.forEach(p=>{if(r.length<4&&re.test(p[0]))r.push(p)}));return r;
}
let ddir='en';
function dSearch(){
  $('dbody').innerHTML=`<div class="card"><div class="row" style="margin:0 0 8px"><button class="btn ${ddir==='en'?'primary':''}" onclick="ddir='en';dSearch()">Anglais → Français</button><button class="btn ${ddir==='fr'?'primary':''}" onclick="ddir='fr';dSearch()">Français → Anglais</button></div>
  <div class="row" style="margin:0"><input type="text" id="dq" placeholder="${ddir==='en'?'Un mot en anglais…':'Un mot en français…'}" style="flex:1" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')doSearch()"><button class="btn primary" onclick="doSearch()">Chercher</button></div>
  <p class="mute">Vous ne comprenez pas un mot ? Tapez-le ici. Les verbes irréguliers (went, bought…) sont reconnus.</p></div><div id="dres"></div>`;
}
async function fetchJSON(u){const r=await fetch(u);if(!r.ok)throw new Error('http '+r.status);return r.json()}
async function doSearch(){
  const raw=$('dq').value,q=clean(raw),el=$('dres');if(!q)return;
  let html='';
  if(ddir==='fr'){const gl=glosFind(q);if(gl.length)html+=`<div class="card"><h3>💼 Glossaire contrôle de gestion</h3>${gl.slice(0,6).map(g=>`<div class="tip" style="display:flex;gap:8px;align-items:center"><div style="flex:1"><b>${esc(g.en)}</b><div class="mute">${esc(g.fr)}</div></div><button class="btn" onclick="sp(${T(g.en)},1)">🔊</button></div>`).join('')}</div>`}
  if(ddir==='en'){
    localFind(q).forEach(v=>{const f=enForms(v);html+=`<div class="card"><b>${esc(v.b)}</b> <span class="mute">verbe · ${v.p?'irrégulier':'régulier'}</span><div>${esc(v.fr)}</div><div class="mute">${v.b} – ${f.past} – ${f.pp}</div><div class="row"><button class="btn" onclick="cverb='${v.b}';dsub='conj';vDico()">⏱️ Conjuguer</button></div></div>`});
    const gl=glosFind(q);if(gl.length)html+=`<div class="card"><h3>💼 Glossaire contrôle de gestion</h3>${gl.slice(0,6).map(g=>`<div class="tip" style="display:flex;gap:8px;align-items:center"><div style="flex:1"><b>${esc(g.en)}</b><div class="mute">${esc(g.fr)}</div></div><button class="btn" onclick="sp(${T(g.en)},1)">🔊</button></div>`).join('')}</div>`;
    const ex=exampleFind(q);if(ex.length)html+=`<div class="card"><h3>Dans vos leçons</h3>${ex.map(p=>`<div class="tip"><b>${esc(p[0])}</b><div class="mute">${esc(p[1])}</div></div>`).join('')}</div>`;
  }
  el.innerHTML=html+'<div class="mute" style="padding:8px">🔎 Recherche dans le dictionnaire en ligne…</div>';
  try{
    const lp=ddir==='en'?'en|fr':'fr|en';
    const [a,b]=await Promise.allSettled([fetchJSON('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+lp),ddir==='en'?fetchJSON('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(q)):Promise.reject()]);
    const tr=[];
    if(a.status==='fulfilled'){const d=a.value,seen=new Set([q]);
      const add=t=>{t=(t||'').trim();const k=t.toLowerCase();if(t&&!seen.has(k)&&t.length<60){seen.add(k);tr.push(t)}};
      add(d.responseData&&d.responseData.translatedText);
      (d.matches||[]).slice().sort((x,y)=>(y.quality*y.match)-(x.quality*x.match)).forEach(m=>add(m.translation));
    }
    let def=null;if(b.status==='fulfilled'&&Array.isArray(b.value))def=b.value[0];
    if(ddir==='fr'&&tr[0]&&!/\s/.test(tr[0])){try{const r=await fetchJSON('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(tr[0].toLowerCase()));if(Array.isArray(r))def=r[0]}catch(e){}}
    if(a.status==='rejected'){if(!html)throw new Error('offline');html+='<div class="card">⚠️ Le dictionnaire en ligne est indisponible (connexion ?). Voici les résultats de votre glossaire et de vos leçons.</div>'}
    const enWord=ddir==='en'?q:(tr[0]||'');
    if(tr.length){const best=tr.slice(0,5);const k=T(ddir==='en'?q:best[0]),fr=ddir==='en'?best[0]:q,en=ddir==='en'?q:best[0];
      html+=`<div class="card"><div class="row" style="margin:0"><div style="flex:1"><div class="en">${esc(ddir==='en'?q:best[0])}</div>${def&&def.phonetic?`<div class="mute">${esc(def.phonetic)}</div>`:''}</div><button class="btn" onclick="sp(${k})">🔊</button><button class="btn" onclick="sp(${k},1)">🐢</button></div>
      <h3 style="margin-top:12px">${ddir==='en'?'En français':'En anglais'}</h3><div style="font-size:19px;font-weight:800">${best.map(esc).join(' · ')}</div>
      <div class="row"><button class="btn primary" onclick="addWord(${T(en)},${T(fr)})">⭐ Ajouter à mes mots</button></div></div>`}
    if(def&&def.meanings){html+=`<div class="card"><h3>Définitions (anglais)</h3>${def.meanings.slice(0,3).map(m=>`<div style="margin-top:8px"><b>${esc(m.partOfSpeech)}</b>${(m.definitions||[]).slice(0,2).map(d=>`<div>• ${esc(d.definition)}${d.example?`<div class="mute">« ${esc(d.example)} »</div>`:''}</div>`).join('')}</div>`).join('')}</div>`}
    if(!tr.length&&!def&&!html)html='<div class="card">Aucun résultat pour « '+esc(q)+' ». Vérifiez l’orthographe.</div>';
    el.innerHTML=html;
  }catch(e){
    el.innerHTML=(html||'')+`<div class="card">⚠️ Le dictionnaire en ligne est indisponible (connexion ?). Les verbes et exemples de vos leçons restent consultables ci-dessus et dans les onglets voisins.</div>`;
  }
}
function addWord(i,j){
  const en=_t[i],fr=_t[j];S.words=S.words||[];
  if(!S.words.find(w=>w.en===en)){S.words.push({en,fr});S.cards[en]=S.cards[en]||{box:0,due:0};S.extra[en]=fr;save();toast('⭐ Ajouté à vos mots et à la révision.',2500)}
  else toast('Déjà dans vos mots.',2000);
}
function dWords(){
  const w=S.words||[];
  $('dbody').innerHTML=w.length?w.map((x,i)=>`<div class="card" style="display:flex;gap:10px;align-items:center"><div style="flex:1"><b>${esc(x.en)}</b><div class="mute">${esc(x.fr)}</div></div><button class="btn" onclick="sp(${T(x.en)})">🔊</button><button class="btn ghost" onclick="S.words.splice(${i},1);save();dWords()">✕</button></div>`).join('')
   :'<div class="card">Aucun mot enregistré. Cherchez un mot dans le dictionnaire puis touchez « ⭐ Ajouter à mes mots » : il rejoindra vos révisions.</div>';
}
/* verbes irréguliers */
function dIrr(){
  $('dbody').innerHTML=`<div class="card"><button class="btn primary big" onclick="startIQ()">🎯 M’entraîner (10 verbes)</button>
  <input type="text" id="iq" value="${esc(iq)}" placeholder="Filtrer : go, aller, bought…" style="width:100%;margin-top:10px" oninput="iq=this.value;irrList()" autocapitalize="off" autocorrect="off" spellcheck="false"></div><div id="ilist"></div>`;
  irrList();
}
function irrList(){
  const q=iq.trim().toLowerCase(),L=VERBS.filter(v=>v.p&&(!q||[v.b,v.p,v.pp,v.fr].some(x=>x.toLowerCase().includes(q))));
  $('ilist').innerHTML=`<div class="mute" style="margin:0 0 6px">${L.length} verbes irréguliers · infinitif — passé simple — participe passé</div>`+L.map(v=>{const t=T(v.b+', '+v.p+', '+v.pp);const w=S.verbs&&S.verbs[v.b];
    return `<div class="card" style="padding:12px 14px;display:flex;gap:8px;align-items:center"><div style="flex:1;min-width:0"><b>${v.b}</b> – ${v.p} – ${v.pp}<div class="mute">${esc(v.fr)}${w?` · ${w.ok}/${w.n} réussis`:''}</div></div><button class="btn" onclick="sp(${t},1)">🔊</button><button class="btn" onclick="cverb='${v.b}';dsub='conj';vDico()">⏱️</button></div>`}).join('');
}
let IQ=null;
function startIQ(){
  const irr=VERBS.filter(v=>v.p),pool=[];S.verbs=S.verbs||{};
  irr.forEach(v=>{const x=S.verbs[v.b],w=x?Math.max(1,x.n-x.ok+1):2;for(let i=0;i<w;i++)pool.push(v)});
  const picks=[];sh(pool).forEach(v=>{if(picks.length<10&&!picks.includes(v))picks.push(v)});
  IQ={list:picks.map(v=>({v,t:Math.random()<.5?'p':'pp'})),i:0,ok:0};showIQ();
}
function showIQ(){
  if(IQ.i>=IQ.list.length){const a=IQ.ok/IQ.list.length;addXP(10,'atelier','verbs');bump((a-.6)*1.2);if(a>=.8)confetti();
    $('view').innerHTML=`<a class="back" onclick="dsub='irr';vDico()">← Verbes irréguliers</a><div class="card" style="text-align:center"><div style="font-size:54px">${a>=.8?'🏆':'💪'}</div><h2>${IQ.ok}/${IQ.list.length}</h2><p class="mute">Les verbes ratés reviendront plus souvent.</p><button class="btn primary" onclick="startIQ()">Rejouer</button></div>`;return}
  const q=IQ.list[IQ.i],v=q.v,ans=q.t==='p'?v.p:v.pp;
  const wrongs=[...new Set([pastReg(v.b),...sh(VERBS.filter(x=>x.p&&x!==v)).map(x=>x[q.t==='p'?'p':'pp'])].filter(x=>x!==ans))].slice(0,2),o=[ans,...wrongs];
  IQ.cur={ans,o:sh(o),v,t:q.t};IQ.lock=false;
  $('view').innerHTML=`<a class="back" onclick="dsub='irr';vDico()">← Verbes irréguliers</a><div class="card"><div class="mute">Verbe ${IQ.i+1}/${IQ.list.length}</div><div class="bar" style="margin:6px 0 12px"><i style="width:${IQ.i/IQ.list.length*100}%"></i></div>
  <div style="font-size:20px;font-weight:800">${q.t==='p'?'Passé simple':'Participe passé'} de <span style="color:var(--brand)">to ${v.b}</span> <span class="mute">(${esc(v.fr)})</span> ?</div>
  ${IQ.cur.o.map((x,i)=>`<button class="opt" id="iq${i}" onclick="iqPick(${i})">${esc(x)}</button>`).join('')}<div id="fbk"></div></div>`;
}
function iqPick(i){
  if(IQ.lock)return;IQ.lock=true;const c=IQ.cur,ok=c.o[i]===c.ans,gi=c.o.indexOf(c.ans);
  $('iq'+gi).classList.add('right');if(!ok)$('iq'+i).classList.add('wrong');
  const w=S.verbs[c.v.b]=S.verbs[c.v.b]||{ok:0,n:0};w.n++;if(ok){w.ok++;IQ.ok++;addXP(2)}else save();
  $('fbk').innerHTML=`<div class="fbk ${ok?'ok':'no'}"><b>${ok?'✅ Bravo !':'❌ Pas tout à fait.'}</b><div><b>${c.v.b} – ${c.v.p} – ${c.v.pp}</b></div><div class="row"><button class="btn" onclick="sp(${T(c.v.b+', '+c.v.p+', '+c.v.pp)},1)">🔊</button></div><button class="btn primary big" style="margin-top:10px" onclick="IQ.i++;showIQ()">Continuer</button></div>`;
}
/* conjugaison */
let cFr=null;
function resolveVerb(raw){
  let w=clean(raw);if(!w)return null;
  if(VMAP.has(w))return VMAP.get(w);
  const hit=VERBS.find(v=>v.p&&(v.p===w||v.pp===w||enForms(v).s3===w||enForms(v).ing===w));
  if(hit)return hit;
  return {b:w,p:null,pp:null,fr:null,k:'er',unknown:1};
}
function dConj(){
  $('dbody').innerHTML=`<div class="card"><div class="row" style="margin:0"><input type="text" id="cv" list="vl" value="${esc(cverb)}" placeholder="Un verbe : work, go, be…" style="flex:1" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')doConj()"><button class="btn primary" onclick="doConj()">Conjuguer</button></div>
  <datalist id="vl">${VERBS.map(v=>`<option value="${v.b}">`).join('')}</datalist>
  <div class="row">${['be','have','do','go','make','take','work','get','see','come'].map(b=>`<button class="btn" onclick="cverb='${b}';dConj()">${b}</button>`).join('')}</div></div><div id="cres"></div>`;
  renderConj();
}
function doConj(){cverb=clean($('cv').value)||cverb;dConj()}
async function renderConj(){
  const v=resolveVerb(cverb),el=$('cres');if(!v)return;
  const f=enForms(v);let fd=null,note='';
  if(v.fr){fd=frData(v.fr,v.k)}
  else{ // verbe non listé : on tente une traduction en ligne
    el.innerHTML='<div class="mute" style="padding:8px">…</div>';
    try{const d=await fetchJSON('https://api.mymemory.translated.net/get?q='+encodeURIComponent('to '+v.b)+'&langpair=en|fr');
      let t=((d.responseData&&d.responseData.translatedText)||'').toLowerCase().replace(/^(pour|à|de)\s+/,'').trim();
      if(/^[a-zàâçéèêëîïôùûüœ]+(er|ir|re)$/.test(t)){const k=t.endsWith('ger')?'ger':t.endsWith('cer')?'cer':t.endsWith('yer')?'yer':t.endsWith('er')?'er':t.endsWith('ir')?'ir':'re';v.fr=t;v.k=k;fd=frData(t,k);note='Verbe non listé : conjugaison française estimée (vérifiez les irrégularités).'}
    }catch(e){}
    note=(note?note+' ':'')+(v.p?'':'L’anglais est conjugué comme un verbe régulier : vérifiez s’il n’est pas irrégulier.');
  }
  const head=`<div class="card"><div class="row" style="margin:0"><div style="flex:1"><div class="en">to ${esc(f.b)}</div><div class="fr">${v.fr?esc(v.fr):'(français non disponible)'}${v.p===null&&!v.unknown?' · verbe régulier':''}${v.p?' · verbe irrégulier':''}</div></div><button class="btn" onclick="sp(${T(f.b+', '+f.past+', '+f.pp)},1)">🔊</button></div>
   <div class="grid2" style="margin-top:10px"><div class="stat" style="box-shadow:none"><b style="font-size:17px">${esc(f.s3)}</b>he/she/it</div><div class="stat" style="box-shadow:none"><b style="font-size:17px">${esc(f.ing)}</b>-ing</div><div class="stat" style="box-shadow:none"><b style="font-size:17px">${esc(f.past)}</b>passé simple</div><div class="stat" style="box-shadow:none"><b style="font-size:17px">${esc(f.pp)}</b>participe passé</div></div>
   ${note?`<div class="tip">${esc(note)}</div>`:''}
   <div class="row">${MODES.map(([k,l])=>`<button class="btn ${cmode===k?'primary':''}" onclick="cmode='${k}';renderConj()">${l}</button>`).join('')}</div></div>`;
  const body=TENSES.map((t,ti)=>`<details class="card" style="padding:0" ${ti===0?'open':''}><summary style="padding:14px 16px;font-weight:900;cursor:pointer">${t.en} <span class="mute">· ${esc(t.fr)}</span></summary><div style="padding:0 16px 14px"><div class="mute">${esc(t.use)}</div><div class="mute">Mots-clés : <i>${esc(t.sig)}</i></div>
   ${[0,1,2,3,4,5].map(k=>{const en=enSentence(f,t.id,k,cmode),fr=fd?frSentence(fd,t.id,k,cmode):'';return `<div style="display:flex;gap:8px;align-items:center;margin-top:8px"><div style="flex:1;min-width:0"><b>${esc(en)}</b>${fr?`<div class="mute">${esc(fr)}</div>`:''}</div><button class="btn" onclick="sp(${T(en)},1)">🔊</button></div>`}).join('')}</div></details>`).join('');
  el.innerHTML=head+body;
}
